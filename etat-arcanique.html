<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<meta name="theme-color" content="#0b1115">
<title>L’État Arcanique</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0b1115;--bg2:#101a20;--pan:#15222a;--pan2:#1c2d36;--line:#2b404b;--txt:#eef4f6;--mut:#97adb8;
  --acc:#2ec4b6;--gold:#ffc145;--dem:#3ec5ff;--hp:#ff5d5d;--ok:#5ee08a;--bad:#ff4d5e;
  --r1:#b8c4cc;--r2:#3d9bff;--r3:#ff9a1f;
  --h:#2ec4b6;--ht:#06201d;
  --c-play:#ff7a3d;--c-shop:#2ec4b6;--c-coll:#3d8bff;--c-decks:#ffc145;--c-friends:#ff4fa0;--c-code:#8bd346;
  --disp:'Lilita One','Inter',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;min-width:1100px}
body{background:radial-gradient(1100px 700px at -5% -10%,#ff7a3d26,transparent 60%),radial-gradient(900px 700px at 105% 0%,#2ec4b62e,transparent 60%),radial-gradient(900px 600px at 50% 115%,#3d8bff24,transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;letter-spacing:.02em}
[hidden]{display:none!important}
.mut{color:var(--mut)}.sm{font-size:13px}.gold{color:var(--gold)}
::-webkit-scrollbar{height:9px;width:9px}::-webkit-scrollbar-thumb{background:#34505e;border-radius:9px}::-webkit-scrollbar-track{background:#0000}
svg.ic{width:1em;height:1em;fill:currentColor;stroke:none;display:block;flex:none}

/* ---------- coque : barre du haut avec onglets ---------- */
#app{display:flex;flex-direction:column;height:100vh}
#top{display:flex;align-items:center;gap:18px;padding:10px 22px;background:linear-gradient(180deg,#14222a,#0f191f);border-bottom:2px solid #2b404b;box-shadow:0 6px 24px #0008;flex:none}
#top .logo{display:flex;align-items:center;gap:10px;flex:none}
#top .logo svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 0 10px #ffc14599)}
#top .logo b{font-family:var(--disp);font-weight:400;letter-spacing:.06em;font-size:22px;background:linear-gradient(90deg,#ffd36b,#ff7a3d 55%,#ff4fa0);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
#nav{display:flex;gap:6px;flex:1;justify-content:center}
#nav button{--h:#fff;background:#ffffff08;border:2px solid #ffffff14;border-radius:14px;padding:7px 16px 7px 10px;color:#dfe9ee;display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;transition:.15s}
#nav button .ni{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;color:var(--h);font-size:20px;background:color-mix(in srgb,var(--h) 16%,transparent)}
#nav button:hover{border-color:color-mix(in srgb,var(--h) 70%,transparent);background:color-mix(in srgb,var(--h) 12%,transparent)}
#nav button.on{background:linear-gradient(180deg,color-mix(in srgb,var(--h) 34%,#10191e),color-mix(in srgb,var(--h) 14%,#10191e));border-color:var(--h);color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--h) 45%,transparent)}
#nav button.on .ni{background:var(--h);color:var(--ht)}
#top #pname{font-weight:700;color:#dfe9ee;font-size:14px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gems{display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#0e3a4a,#0a2731);border:2px solid #3ec5ff;border-radius:999px;padding:5px 16px 5px 10px;font-weight:800;font-size:17px;box-shadow:0 0 14px #3ec5ff44}
.gems .gi{width:22px;height:22px;display:grid;place-items:center;font-size:18px}
#view{flex:1;overflow:auto;padding:22px 26px 40px}
#view>*{max-width:1240px;margin-left:auto;margin-right:auto}
#view[data-t=play]{--h:var(--c-play);--ht:#2a1000}#view[data-t=shop]{--h:var(--c-shop);--ht:#032521}#view[data-t=coll]{--h:var(--c-coll);--ht:#001a3d}
#view[data-t=decks]{--h:var(--c-decks);--ht:#2e2000}#view[data-t=friends]{--h:var(--c-friends);--ht:#3a0020}#view[data-t=code]{--h:var(--c-code);--ht:#152800}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.cols>div>.panel:last-child{margin-bottom:0}

/* ---------- boutons, panneaux, puces ---------- */
.btn{background:linear-gradient(180deg,#26404c,#1b2e37);border:2px solid #3e6070;color:#fff;border-radius:12px;padding:9px 16px;font-weight:700;transition:.15s;box-shadow:0 3px 0 #0a1418}
.btn:hover{border-color:#7fa9bb;filter:brightness(1.08)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a1418}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--h) 100%,#fff 18%),color-mix(in srgb,var(--h) 100%,#000 18%));border-color:color-mix(in srgb,var(--h) 60%,#fff);color:var(--ht);box-shadow:0 3px 0 color-mix(in srgb,var(--h) 45%,#000),0 6px 20px color-mix(in srgb,var(--h) 35%,transparent)}
.btn.gold{background:linear-gradient(180deg,#ffd36b,#f29d1c);color:#2a1a00;border-color:#fff1c4;box-shadow:0 3px 0 #8a5a00,0 6px 18px #ffc14544}
.btn.danger{background:linear-gradient(180deg,#c23246,#8e1a2b);border-color:#ff8a98;box-shadow:0 3px 0 #3d0611}
.btn.green{background:linear-gradient(180deg,#4fe399,#1aa765);color:#00281a;border-color:#c4ffe2;box-shadow:0 3px 0 #0a5a3a}
.btn[disabled]{opacity:.42;pointer-events:none;filter:saturate(.4)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px;box-shadow:0 2px 0 #0a1418}
.btn.lg{padding:13px 22px;font-size:17px;border-radius:14px}
.btn small{display:block;font-size:11.5px;font-weight:600;opacity:.85;margin-top:1px}
.panel{background:linear-gradient(180deg,#172630,#121d24);border:2px solid #2b404b;border-radius:18px;padding:16px 18px;margin-bottom:18px;box-shadow:0 8px 22px #0007,inset 0 1px 0 #ffffff14}
.panel h3{font-family:'Inter',system-ui,sans-serif;font-weight:800;font-size:18px;letter-spacing:.01em;margin-bottom:12px;display:flex;align-items:center;gap:10px;color:#fff}
.panel h3 .pi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:18px;background:linear-gradient(135deg,var(--h),color-mix(in srgb,var(--h) 50%,#000));color:var(--ht);box-shadow:0 3px 10px color-mix(in srgb,var(--h) 40%,transparent)}
.panel.hl{border-color:color-mix(in srgb,var(--h) 70%,#2b404b);box-shadow:0 8px 22px #0007,0 0 22px color-mix(in srgb,var(--h) 22%,transparent),inset 0 1px 0 #ffffff14}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#1c2d36;border:2px solid #34505e;border-radius:999px;padding:5px 13px;font-size:13.5px;font-weight:600;cursor:pointer;user-select:none;color:#fff;white-space:nowrap}
.chip:hover{border-color:#7fa9bb}
.chip.on{background:var(--h);border-color:#fff;color:var(--ht);box-shadow:0 0 12px color-mix(in srgb,var(--h) 50%,transparent)}
.chip.off{opacity:.45}
.chip i{font-style:normal}
input[type=text],input:not([type]){background:#0b1418;border:2px solid #34505e;border-radius:12px;color:#fff;padding:10px 12px;font:inherit;min-width:0}
input:focus{outline:3px solid color-mix(in srgb,var(--h) 45%,transparent);border-color:var(--h)}
input::placeholder{color:#6f8a96}
.dot{width:10px;height:10px;border-radius:50%;background:#556;display:inline-block}.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.bar{height:10px;border-radius:99px;background:#0b1418;overflow:hidden;border:1px solid #ffffff1a}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2ec4b6,#ffc145,#ff7a3d)}
.grid{display:grid;gap:10px}
.setgrp{margin:10px 0}.setgrp b{display:block;font-size:13px;color:#dfe9ee;margin-bottom:6px;font-weight:700}
.deckchips{display:flex;gap:10px;overflow:auto;padding:4px 2px 8px}
.dchip{min-width:150px;flex:0 0 auto;background:#1a2a33;border:2px solid #34505e;border-radius:14px;padding:10px 12px;cursor:pointer}
.dchip:hover{border-color:#7fa9bb}
.dchip.on{border-color:var(--h);background:linear-gradient(180deg,color-mix(in srgb,var(--h) 26%,#1a2a33),#1a2a33);box-shadow:0 0 14px color-mix(in srgb,var(--h) 40%,transparent)}.dchip.bad{opacity:.55}.dchip b{display:block;font-size:15px}.dchip small{color:var(--mut)}
.seg{display:flex;gap:4px;background:#0b1418;border:2px solid #2b404b;border-radius:15px;padding:4px;margin-bottom:18px}
.seg button{flex:1;background:none;border:0;border-radius:11px;padding:10px 4px;font-weight:700;font-size:14.5px;color:#cfdde3}
.seg button:hover{background:#ffffff0c}
.seg button.on{background:var(--h);color:var(--ht);box-shadow:0 3px 10px color-mix(in srgb,var(--h) 45%,transparent)}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:800}

/* filtres */
.fbar{display:flex;flex-direction:column;gap:8px}
.fbar .fr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fbar .fr .chip{padding:4px 11px;font-size:13px;flex:none}
.fbar .fr .fl{flex:none;align-self:center;font-size:12px;font-weight:800;color:#cfdde3;width:60px}
.fbar input{width:100%}
.fchip{height:32px;padding:0 10px!important;font-size:15px;border-color:var(--fc)!important;background:color-mix(in srgb,var(--fc) 16%,#15222a)!important}
.fchip.on{background:var(--fc)!important;color:#111!important;box-shadow:0 0 12px var(--fc)}
.fchip em{font-style:normal;font-size:12px;font-weight:800}
.cchip{min-width:34px;justify-content:center;padding:4px 0!important}

/* ---------- cartes (échelle par container query) ---------- */
.card{container-type:inline-size;position:relative;aspect-ratio:5/7.6;width:100%;user-select:none;-webkit-user-select:none}
.card .ci{position:absolute;inset:0;border-radius:6cqw;background:linear-gradient(180deg,var(--rb1),var(--rb2));border:1.6cqw solid var(--rc);box-shadow:0 .8cqw 3cqw #000b;overflow:hidden;display:flex;flex-direction:column}
/* raretés : cadre, bandeau du nom, fond teinté et gemme (● commune, ◆ rare, ★ épique) */
.card{--rc:#b9c4cb;--rn1:#62707a;--rn2:#3a464e;--rb1:#242d33;--rb2:#141a1e;--rg:#eef3f6}
.card.r2{--rc:#3d9bff;--rn1:#2f80ff;--rn2:#183f8e;--rb1:#182a4c;--rb2:#0e1629;--rg:#a8d6ff}
.card.r3{--rc:#ffa62b;--rn1:#ff9d24;--rn2:#a5460a;--rb1:#3d2513;--rb2:#1e1209;--rg:#ffe08a}
.card .cn{display:flex;align-items:center;gap:2cqw;padding:2cqw 2.6cqw 1.6cqw 2cqw;height:13cqw;background:linear-gradient(180deg,var(--rn1),var(--rn2));border-bottom:.6cqw solid #0008;flex:none}
.card .rg{flex:none;font-size:7.4cqw;line-height:1;color:var(--rg);text-shadow:0 0 2.4cqw var(--rc),0 .3cqw .6cqw #000}
.card .ep.sp{font-style:normal;letter-spacing:.2em;text-transform:uppercase;color:#ffe0cf;font-size:4.2cqw;font-weight:900}
.card .cc{flex:none;width:10cqw;height:10cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff1ff,#1aa3d8);color:#02202e;font-weight:900;font-size:6.6cqw;display:grid;place-items:center;box-shadow:0 0 0 .6cqw #000a,0 0 2.5cqw #3ec5ff99}
.card .nm{font-family:var(--disp);font-size:7.4cqw;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;letter-spacing:.02em;text-shadow:0 .4cqw 1cqw #000a}
.card .ca{position:relative;margin:1.6cqw 2cqw 0;aspect-ratio:1/.92;border-radius:3cqw;overflow:hidden;background:#0a1013;border:.6cqw solid #000a;flex:none;isolation:isolate}
.card .ca img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.card .ca .sy{position:absolute;inset:0;display:grid;place-items:center;font-size:42cqw;filter:drop-shadow(0 1cqw 2cqw #0008);text-shadow:0 0 6cqw #fff6}
.card .ep{position:absolute;left:0;right:0;top:0;padding:1cqw 2.4cqw 3cqw;background:linear-gradient(180deg,#000c,#0000);font-size:4.6cqw;font-weight:700;font-style:italic;color:#ffe3b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* familles : pastilles colorées */
.card .fc{position:absolute;left:1.4cqw;bottom:1.4cqw;display:flex;gap:1cqw}
.card .fc i{font-style:normal;font-size:5.2cqw;line-height:1;background:var(--fc);border:.6cqw solid #fff;border-radius:99px;padding:.6cqw 1.7cqw;display:flex;align-items:center;gap:1cqw;color:#111;font-weight:900;box-shadow:0 .5cqw 1.5cqw #000b}
.card .fc i em{display:none;font-style:normal;font-size:4cqw;letter-spacing:.03em}
.card.big .fc i em{display:inline}
.card .kws{position:absolute;right:1.2cqw;top:1.2cqw;display:flex;flex-direction:column;gap:.8cqw;align-items:flex-end}
.card .kws i{font-style:normal;font-size:5.4cqw;background:#000c;border:.5cqw solid #ffffff44;border-radius:99px;padding:.5cqw 1.8cqw;line-height:1.1;color:#fff;font-weight:800}
.card .kws i.vn{background:#2b5410;border-color:#a6ff6a;color:#d9ffc0}
/* affinités : 4 jeux, 0 à 2 points */
.card .afr{display:flex;gap:1.2cqw;margin:1.2cqw 2cqw 0;flex:none}
.card .afr span{flex:1;display:flex;align-items:center;justify-content:center;gap:1cqw;height:8cqw;border-radius:99px;border:.6cqw solid color-mix(in srgb,var(--gc) 80%,#000);background:color-mix(in srgb,var(--gc) 24%,#0b1215);font-size:5cqw;line-height:1}
.card .afr span.z{opacity:.35;filter:saturate(.3)}
.card .afr span b{display:flex;gap:.5cqw}
.card .afr span b i{width:2.5cqw;height:2.5cqw;border-radius:50%;background:#ffffff30;display:block}
.card .afr span b i.f{background:var(--gc);box-shadow:0 0 1cqw var(--gc)}
.card .ct{flex:1;margin:1.2cqw 2cqw 2cqw;padding:1.4cqw 2cqw 5.4cqw;border-radius:2.4cqw;background:linear-gradient(180deg,#0b1215,#121c22);font-size:5.9cqw;line-height:1.15;color:#eef4f6;overflow:hidden;text-align:center;display:flex;align-items:center;justify-content:center;position:relative}
.card .ct.l{font-size:5.1cqw}.card .ct.xl{font-size:4.5cqw}
.card .ct .kw{color:#ffd36b;font-weight:800;border-bottom:.4cqw dotted #ffd36b99;cursor:help}
.card .st{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:0 3cqw 2.4cqw;pointer-events:none}
.card .st b{min-width:10.5cqw;height:8.6cqw;border-radius:99px;display:grid;place-items:center;font-size:6cqw;font-weight:900;color:#fff;padding:0 2cqw;border:.7cqw solid #000b;box-shadow:0 .5cqw 1.5cqw #000a}
.card .st .at{background:linear-gradient(180deg,#ffc15a,#e07010)}
.card .st .hpv{background:linear-gradient(180deg,#ff7b7b,#c82535)}
.card .st b.up{color:#d6ffe0;box-shadow:0 0 2.5cqw #5ee08a}.card .st b.dn{color:#ffd0d0}
.card .st b.hurt{color:#ffe14d}
.card .rr{position:absolute;left:50%;transform:translateX(-50%);bottom:.5cqw;font-size:3.8cqw;letter-spacing:.2em;color:var(--rc);opacity:.95;text-transform:uppercase;font-weight:800;white-space:nowrap}
.card.s .ct{padding-bottom:2cqw}
/* mode plateau : illustration, stats, familles, terrain */
.card.bd .cn,.card.bd .ct,.card.bd .rr,.card.bd .afr,.card.bd .ep{display:none}
.card.bd .ca{margin:0;border-radius:6cqw;position:absolute;inset:0;aspect-ratio:auto;border:0}
.card.bd .ci{border-radius:8cqw;border-width:2cqw}
.card.bd .st{padding:0 3cqw 3cqw}
.card.bd .st b{min-width:21cqw;height:16cqw;font-size:12.5cqw}
.card.bd .kws i{font-size:11.5cqw;padding:.8cqw 2.6cqw}
.card.bd .fc{left:50%;transform:translateX(-50%);bottom:2.4cqw;gap:1.6cqw}
.card.bd .fc i{font-size:12cqw;padding:1cqw 2.4cqw;border-width:1.2cqw}
.card.bd .fc i.on{box-shadow:0 0 5cqw var(--fc),0 0 0 1.2cqw #fff}
.card.bd .fc i.off{opacity:.6;filter:saturate(.6)}
.card .bnm{display:none;position:absolute;left:0;right:0;top:0;padding:1cqw 2cqw 1.6cqw;background:linear-gradient(180deg,var(--rn1),color-mix(in srgb,var(--rn2) 85%,transparent) 70%,transparent);text-shadow:0 .4cqw 1cqw #000;font-size:10cqw;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.bd .bnm{display:block}
.card .bdg{position:absolute;left:2cqw;top:14cqw;display:flex;flex-direction:column;gap:1cqw;z-index:3}
.card .bdg i{font-style:normal;font-size:11cqw;line-height:1;background:#000c;border-radius:99px;padding:1cqw 3cqw;font-weight:800}
.card .bdg i.pz{background:#2b5410;color:#d0ff9f}.card .bdg i.blk{background:#5a2a2a}
.card .tb{position:absolute;left:50%;transform:translateX(-50%);top:13cqw;display:none;align-items:center;gap:1.4cqw;background:color-mix(in srgb,var(--gc) 75%,#000);border:1cqw solid #fff;border-radius:99px;padding:.6cqw 2.8cqw;font-size:10cqw;line-height:1;z-index:3;box-shadow:0 0 4cqw var(--gc)}
.card.bd .tb{display:flex}
.card .tb b{display:flex;gap:1cqw}.card .tb b i{width:3.6cqw;height:3.6cqw;border-radius:50%;background:#0006;display:block}.card .tb b i.f{background:#fff}
.card .tb.z{opacity:.55;box-shadow:none;filter:saturate(.4)}
.card.big{aspect-ratio:5/7.6}
.card.dim .ci{filter:grayscale(.85) brightness(.55)}
.card.mut-x .ca img{filter:grayscale(1)}
.card.eg .ci{box-shadow:0 0 0 1cqw #fff,0 0 6cqw #9fe8ff}
.card.sel .ci{outline:1.4cqw solid #fff;box-shadow:0 0 6cqw #fffa}
.card.can .ci{box-shadow:0 0 0 1.2cqw #5ee08a,0 0 5cqw #5ee08aaa}
.card.tg .ci{box-shadow:0 0 0 1.6cqw #ff4d5e,0 0 6cqw #ff4d5e}
.card.tgo .ci{box-shadow:0 0 0 1.6cqw #3ec5ff,0 0 6cqw #3ec5ff}
.card.exil .ci{opacity:.5;filter:saturate(.4) brightness(1.1)}
.card .exo{display:none;position:absolute;inset:0;z-index:6;place-items:center;font-size:30cqw;text-shadow:0 0 6cqw #3ec5ff;pointer-events:none;animation:floaty 1.6s ease-in-out infinite}
.card.exil .exo{display:grid}
@keyframes floaty{50%{transform:translateY(-4cqw)}}
.card.fam .ci{animation:famglow .9s ease-out}
@keyframes famglow{0%{box-shadow:0 0 0 2cqw var(--fg),0 0 12cqw var(--fg)}100%{box-shadow:0 .8cqw 3cqw #000b}}
/* épique : un reflet de lumière parcourt le cadre */
.card .shn{position:absolute;inset:0;border-radius:6cqw;padding:1.6cqw;pointer-events:none;z-index:7;
  background:linear-gradient(115deg,transparent 0 40%,#fff9 47%,#fff1cc 50%,#fff9 53%,transparent 60% 100%) 0 0/300% 100% no-repeat;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:shn 5s ease-in-out infinite}
.card.bd .shn,.card.bd .pfr{border-radius:8cqw;padding:2cqw}
@keyframes shn{0%,12%{background-position:120% 0}62%,100%{background-position:-20% 0}}
/* prismatique : feuille holographique sur l'illustration, paillettes, cadre irisé, reflet qui suit la souris */
.card .holo,.card .hgl,.card .spk{position:absolute;inset:0;pointer-events:none}
/* 1) teinte irisée légère sur toute l'illustration */
.card .holo{background:linear-gradient(125deg,#ff9ac8,#ffe08f 22%,#a6ffcc 44%,#8fdcff 66%,#ffb6d8 88%);background-size:250% 250%;mix-blend-mode:soft-light;opacity:.55;animation:holo 12s ease-in-out infinite alternate}
/* 2) bande arc-en-ciel striée qui balaie la carte (ou suit la souris) */
.card .hgl{background:repeating-linear-gradient(118deg,#ff7eb6 0,#ffd27a 3.5cqw,#9dffc0 7cqw,#7ad8ff 10.5cqw,#ff7eb6 14cqw),repeating-linear-gradient(28deg,#0000 0 1.6cqw,#0004 1.6cqw 2cqw);
  background-blend-mode:multiply;mix-blend-mode:color-dodge;opacity:.5;
  -webkit-mask:linear-gradient(115deg,#0000 30%,#000 48%,#000 52%,#0000 70%) 0 0/300% 300% no-repeat;mask:linear-gradient(115deg,#0000 30%,#000 48%,#000 52%,#0000 70%) 0 0/300% 300% no-repeat;
  animation:hgl 5.5s ease-in-out infinite}
@keyframes hgl{0%,10%{-webkit-mask-position:110% 110%;mask-position:110% 110%}70%,100%{-webkit-mask-position:-10% -10%;mask-position:-10% -10%}}
/* 3) éclats en étoile qui scintillent à tour de rôle */
.card .spk i{position:absolute;width:var(--z,6cqw);height:var(--z,6cqw);margin:calc(var(--z,6cqw) / -2);opacity:0;
  background:radial-gradient(circle,#fff 0 14%,#fff0 16%),linear-gradient(#fff0 44%,#fff 50%,#fff0 56%),linear-gradient(90deg,#fff0 44%,#fff 50%,#fff0 56%);
  filter:drop-shadow(0 0 .8cqw #fff) drop-shadow(0 0 1.6cqw #bfefff);animation:twk 3.6s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:0;transform:scale(.2) rotate(0deg)}45%{opacity:0}55%{opacity:1;transform:scale(1) rotate(45deg)}70%{opacity:0;transform:scale(.4) rotate(90deg)}}
.card.prism .cn{position:relative}
.card.prism .cn::after{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;
  background:linear-gradient(110deg,#0000 30%,#ffffff70 44%,#ffe7a680 50%,#aee8ff80 56%,#0000 70%) 0 0/260% 100% no-repeat;animation:shn 4.5s ease-in-out infinite}
@keyframes holo{0%{background-position:0% 0%}100%{background-position:100% 100%}}
.card.prism.hov .hgl{animation:none;opacity:.6;-webkit-mask:radial-gradient(circle at var(--mx) var(--my),#000 0,#0008 22%,#0000 48%);mask:radial-gradient(circle at var(--mx) var(--my),#000 0,#0008 22%,#0000 48%);
  background-position:calc(var(--mx) * .6) calc(var(--my) * .6),0 0}
.card.prism.hov .holo{animation:none;background-position:var(--mx) var(--my)}
.card.prism.hov .spk i{animation-duration:1.8s}
.card .pfr{position:absolute;inset:0;border-radius:6cqw;padding:1.6cqw;pointer-events:none;z-index:7;
  background:conic-gradient(from var(--ang,0deg),#ffb3d6,#ffe7a6,#b8ffd6,#aee8ff,#ffc9e4,#ffb3d6);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;mix-blend-mode:screen;opacity:.6;animation:spin 9s linear infinite}
.card .pst{flex:none;font-size:7.4cqw;line-height:1;margin-right:.6cqw;background:linear-gradient(120deg,#ffb3d6,#ffe7a6,#b8ffd6,#aee8ff,#ffb3d6) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .3cqw .5cqw #000c);animation:holo 4s linear infinite}
/* reflet et inclinaison au survol (collection, fiches, butin) */
.card .glr{position:absolute;inset:0;border-radius:6cqw;pointer-events:none;z-index:8;opacity:0;transition:opacity .25s;mix-blend-mode:overlay;
  background:radial-gradient(circle at var(--mx,50%) var(--my,30%),#ffffff60,#ffffff12 32%,transparent 58%)}
.card.prism .glr{background:radial-gradient(circle at var(--mx,50%) var(--my,30%),#ffffffb0,#ffffff26 30%,transparent 58%)}
.card.hov .glr{opacity:1}
.card.tilt{transition:transform .4s ease-out}
.card.tilt.hov{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.04);transition:transform .08s linear;z-index:5}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
@keyframes foil{0%{background-position:130% 0}100%{background-position:-30% 100%}}
@keyframes tw{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.cardback .ci{background:repeating-linear-gradient(45deg,#ffffff07 0 6px,transparent 6px 14px),radial-gradient(circle at 50% 40%,#1f6a70,#0d2228 70%);display:grid;place-items:center;font-size:30cqw;color:#ffc145cc;border-color:#2ec4b6}

/* ---------- boutique ---------- */
.packs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}

.odds{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 12px}

.buyrow{display:grid;gap:8px;max-width:360px;margin:0 auto}
#packov{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 40%,#123a40fa,#05080aff 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.stage{position:relative;width:260px;height:390px;display:grid;place-items:center;flex:none}
.stage .pk{width:100%;height:100%;margin:0;border-radius:18px;position:absolute;transition:transform .5s,opacity .5s}
.stage .pk .pl{font-size:17px}.stage .pk .pl b{font-size:60px}
.stage .pk.idle{animation:float 2.4s ease-in-out infinite}
.stage .pk.shake{animation:shake .12s linear 6}
.stage .pk.open{transform:translateY(34%) scale(.8);opacity:0;transition:transform .5s,opacity .6s .15s}
.stage .pk.open::after{display:none}
.stage .top{position:absolute;left:0;right:0;top:0;height:18%;z-index:3;border-radius:18px 18px 0 0;background:linear-gradient(160deg,#5fe0d4,#1a6f73);border:2px solid #d4fff9;transform-origin:0 100%;display:block}

.stage .beam{position:absolute;left:10%;right:10%;top:16%;height:20%;z-index:2;background:radial-gradient(ellipse at 50% 100%,#fff,#ffe6a0aa 40%,transparent 70%);filter:blur(6px);opacity:0}

.stage .pcard{position:absolute;width:88%;z-index:4;transform:translateY(60%) scale(.4);opacity:0;transition:transform .8s cubic-bezier(.2,.9,.25,1.1),opacity .3s}
.stage .pcard.up{transform:translateY(-4%) scale(1);opacity:1}
.stage .pcard.out{transform:translate(-130%,-10%) rotate(-18deg) scale(.7);opacity:0;transition:transform .35s ease-in,opacity .35s}
.stage .pcard .fl{perspective:1000px}
.stage .pcard .fi{position:relative;transform-style:preserve-3d;transition:transform .7s;aspect-ratio:5/7.6}
.stage .pcard.rev .fi{transform:rotateY(180deg)}
.stage .pcard .fi>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.stage .pcard .fi>.fr{transform:rotateY(180deg)}
.stage .glow{position:absolute;inset:-6%;z-index:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gc,#fff) 55%,transparent) 0,transparent 62%);opacity:0;transition:opacity .8s}
.stage .glow.pr{background:conic-gradient(from var(--ang,0deg),#ffb3d655,#ffe7a655,#b8ffd655,#aee8ff55,#ffb3d655);filter:blur(28px);animation:spin 6s linear infinite}
.stage .glow.on{opacity:.8}
.stage .glow.on:not(.pr){animation:pulse 1.6s ease-in-out infinite}
.spark{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--gc,#fff);box-shadow:0 0 10px var(--gc,#fff);z-index:6;animation:burst 1.2s ease-out forwards}
.newr{position:absolute;top:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:7;background:linear-gradient(90deg,#ffd36b,#ff7a3d);color:#2a1300;font-weight:800;padding:3px 14px;border-radius:99px;font-size:12px;letter-spacing:.08em;box-shadow:0 4px 14px #0008}

@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}

@keyframes blink{50%{opacity:.6}}
.ibtn{background:linear-gradient(180deg,#26404c,#1b2e37);border:2px solid #3e6070;border-radius:12px;width:42px;height:38px;font-size:17px;line-height:1;display:grid;place-items:center;color:#fff}

.hn{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:900;text-shadow:0 1px 3px #000}
.res{display:flex;flex-direction:column;gap:3px;align-items:flex-end;flex:none}
.crys{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:170px}

.hpz{position:absolute;left:36px;top:-9px;background:#2b5410;color:#d0ff9f;border-radius:99px;font-size:12px;padding:0 8px;font-weight:800;border:1.5px solid #8bd346}
/* synergies de familles */
.fxrow{display:flex;gap:6px;align-items:center;height:26px;overflow:hidden}

.fx{flex:none;display:flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 4px;border-radius:99px;border:1.5px solid var(--fc);background:color-mix(in srgb,var(--fc) 16%,#0b1418);font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap;position:relative}

.fx.on{background:var(--fc);color:#111;box-shadow:0 0 10px var(--fc)}

.board{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:4px;border-radius:14px}
.board.o{background:linear-gradient(180deg,#ff4d5e14,#ff4d5e06)}.board.m{background:linear-gradient(180deg,#2ec4b606,#2ec4b61c)}
.slot{position:relative;aspect-ratio:5/6.3;border-radius:10px;background:#ffffff08;border:1.5px dashed #ffffff30;transition:.15s}
.slot.empty.hi{background:#5ee08a22;border-color:#5ee08a;border-style:solid;box-shadow:0 0 12px #5ee08a77 inset}
.slot.hov{background:#5ee08a55}
.slot .card{position:absolute;inset:0;height:100%;aspect-ratio:auto;cursor:pointer}
.slot.flash::after{content:'';position:absolute;inset:-6px;border-radius:14px;border:3px solid var(--gc,#fff);box-shadow:0 0 22px var(--gc,#fff);animation:sflash .9s ease-out forwards;pointer-events:none;z-index:9}
@keyframes sflash{0%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.12)}}
.exb{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);z-index:8;background:linear-gradient(180deg,#5fd8ff,#1689c4);color:#002033;border:2px solid #fff;border-radius:99px;font-size:11.5px;font-weight:900;padding:1px 9px;white-space:nowrap;box-shadow:0 0 12px #3ec5ff}

.tstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;height:22px}
.tcell{border-radius:7px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden;white-space:nowrap;border:1.5px solid #ffffff55;color:#fff;text-shadow:0 1px 3px #000;cursor:pointer;background:linear-gradient(180deg,color-mix(in srgb,var(--gc) 85%,#fff 6%),color-mix(in srgb,var(--gc) 45%,#000))}
.tcell .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;padding:0 5px}
.tcell.none{background:#ffffff08;border:1.5px dashed #ffffff22;color:#ffffff40;text-shadow:none;cursor:default}
.tcell.pv{background:#ffc145cc!important;border:2px solid #fff;color:#2a1a00;text-shadow:none}
.tcell.tfl{animation:tfl .9s ease-out}
@keyframes tfl{0%{filter:brightness(2.2);box-shadow:0 0 20px var(--gc)}100%{filter:none}}
.mid{display:flex;align-items:stretch;gap:8px;min-height:62px}
.shopz{flex:1;display:flex;gap:7px;align-items:stretch;background:#0b141888;border:2px solid #2b404b;border-radius:14px;padding:6px 8px;min-width:0}
.shopz .lb{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.12em;color:#cfdde3;text-align:center;font-weight:800}
.shT{flex:1;min-width:0;border-radius:10px;border:2px solid #ffffff55;color:#fff;padding:3px 8px;display:flex;flex-direction:column;justify-content:center;font-size:11px;line-height:1.2;cursor:pointer;position:relative;background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 80%,#fff 5%),color-mix(in srgb,var(--gc) 38%,#000))}
.shT b{font-size:12.5px;line-height:1.12;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:1px;text-shadow:0 1px 3px #000a}.shT .r1{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:6px}.shT .sz{display:flex;gap:2px}.shT .sz i{width:11px;height:6px;border-radius:2px;background:#fff}
.shT .ef{font-size:10.5px;opacity:.95;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.shT .pr{font-weight:900;color:#fff2b0;font-size:13px;text-shadow:0 1px 3px #000}
.shT .agetag{position:absolute;right:5px;top:-9px;font-size:10px;font-weight:800;background:#ff4d5e;color:#fff;border-radius:99px;padding:0 6px;border:1.5px solid #fff;white-space:nowrap}
.shT.can{box-shadow:0 0 0 2px #ffc145,0 0 12px #ffc14588}.shT.no{opacity:.55}.shT.sel{box-shadow:0 0 0 3px #fff}
.shT.void{border-style:dashed;opacity:.3;pointer-events:none}
.shT.fresh{animation:fresh .9s ease-out}
@keyframes fresh{0%{transform:translateY(-14px) scale(.85);opacity:0}100%{transform:none;opacity:1}}
.evb{flex:none;width:130px;font-size:11px;color:#dfe9ee;background:#0b141888;border:2px solid #2b404b;border-radius:14px;padding:5px 8px;line-height:1.25}
.evb b{color:#ffd36b;display:block;font-size:11.5px}
.endb{flex:none;min-width:120px;border-radius:15px;font-weight:900;font-size:15px;background:linear-gradient(180deg,#ffd36b,#f29d1c);color:#2a1a00;border:2px solid #fff1c4;box-shadow:0 3px 0 #8a5a00,0 6px 18px #ffc14566;padding:4px 12px;line-height:1.15;position:relative;overflow:hidden}
.endb small{display:block;font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
.endb .eb{position:absolute;left:0;bottom:0;height:5px;background:#2a1a00;opacity:.55;transition:width .25s linear}
.endb.wait{background:linear-gradient(180deg,#26404c,#1b2e37);color:#cfdde3;border-color:#3e6070;box-shadow:none}
.endb.wait .eb{background:#ff6f8a;opacity:.9}
.endb.pulse{animation:pulseb 1.1s infinite}
@keyframes pulseb{50%{box-shadow:0 3px 0 #8a5a00,0 0 0 7px #ffc14544,0 6px 18px #ffc14566}}
.info{min-height:52px;background:linear-gradient(180deg,#172630,#121d24);border:2px solid #2b404b;border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.3;position:relative}
.irow{display:flex;gap:10px;align-items:stretch;flex:1;min-width:0}
.hintline{font-weight:800;color:#ffd36b;font-size:13.5px}
.info .ib{flex:1;min-width:0}
.info .ib b.t{font-size:15px;font-family:var(--disp);font-weight:400}
.info .ib .txt{color:#fff;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .ib .kw{color:#ffd36b;font-weight:800;border-bottom:1px dotted #ffd36b99;cursor:help}
.info .ib .dfs{color:#cfdde3;font-size:12px;margin-top:2px}.info .ib .dfs b{color:#ffd36b}
.info .play{flex:none;align-self:center}
.hand{display:flex;align-items:flex-start;justify-content:center;gap:8px;overflow:visible;padding:12px 4px 0;height:calc(var(--sw)*1.25 + 14px);margin-top:auto;position:relative;z-index:5}
.hc{flex:0 0 auto;width:var(--hw);aspect-ratio:5/7.6;cursor:grab;transition:transform .15s;position:relative}
.hc:hover{transform:translateY(calc(min(0px,var(--sw)*1.25 - var(--hw)*1.52) - 10px)) scale(1.05);z-index:4}
.hc .card{height:100%;width:100%}
.hc.sel{transform:translateY(calc(min(0px,var(--sw)*1.25 - var(--hw)*1.52) - 14px))}
.hc.drag{opacity:.25}
.hc.np .card .ci{filter:brightness(.6) saturate(.7)}
.hc.can .card .ci{box-shadow:0 0 0 1.2cqw #5ee08a,0 0 4cqw #5ee08aaa}
.ghost{position:fixed;z-index:80;pointer-events:none;width:110px;transform:translate(-50%,-60%) rotate(-4deg) scale(1.05);filter:drop-shadow(0 12px 18px #000a);opacity:.96}
.ghost.terr{width:auto}
#hist{width:316px;flex:none;border-left:3px solid #26414d;background:#091116;overflow:auto;padding:8px 10px 14px}
.hh{display:flex;gap:6px;align-items:center;margin-bottom:6px;position:sticky;top:-8px;background:#091116;padding:6px 0;z-index:2}
.hh b{flex:1;font-family:var(--disp);font-weight:400;font-size:17px}
.hturn{margin:12px 0 5px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7fe9dd;display:flex;align-items:center;gap:8px;font-weight:800}
.hturn.opp{color:#ff9aa6}
.hturn::before,.hturn::after{content:'';flex:1;height:1px;background:currentColor;opacity:.35}
.hact{border-radius:10px;padding:4px 6px 4px 4px;margin-bottom:6px;font-size:12.5px;display:flex;flex-direction:column;gap:2px;background:#2ec4b614;border-left:4px solid #2ec4b6}
.hact.opp{border-left-color:#ff5d6c;background:#ff5d6c14}
.hr{display:flex;flex-wrap:wrap;gap:3px 5px;align-items:center;padding:2px 4px 2px 6px;border-left:3px solid transparent;border-radius:4px;line-height:1.35}
.hr.main{font-weight:700;font-size:13px}
.hr:not(.main){margin-left:8px;border-left-color:#ffffff22;color:#dbe7ec}
.hr.k-dmg{border-left-color:#ff6b7a}.hr.k-heal{border-left-color:#6dffa0}.hr.k-gold,.hr.k-buy{border-left-color:#ffd36b}.hr.k-pz{border-left-color:#a6ff6a}
.hr.k-buff{border-left-color:#5fb0ff}.hr.k-ctl{border-left-color:#3ec5ff}.hr.k-tfx,.hr.k-fac{border-left-color:#ffb13d}.hr.k-sum{border-left-color:#66e0c8}.hr.k-die{border-left-color:#8a98a1}
.hr.k-sys{border-left-color:#ffc145;background:#ffc14512}
.mi{display:inline-flex;align-items:center;gap:4px;background:#000b;border:1.5px solid var(--mc,#34505e);border-radius:99px;padding:1px 8px 1px 2px;font-size:12px;white-space:nowrap;font-weight:700}
.mi[data-k]{cursor:help}.mi[data-k]:hover{background:#000;box-shadow:0 0 0 2px var(--mc)}
.mi img,.mi u{width:22px;height:22px;border-radius:50%;object-fit:cover;display:grid;place-items:center;text-decoration:none;font-size:12px;background:#2b404b;flex:none}
.mi.hch.me{--mc:#2ec4b6}.mi.hch.me u{background:#1f8a80}.mi.hch.op{--mc:#ff5d6c}.mi.hch.op u{background:#b8304d}
.hr .vb{font-size:14px;line-height:1}.hr .by{opacity:.7;font-size:11px;font-style:italic}.hr .pst{color:#ffd36b;font-weight:900}
.hr .dm{color:#ff8a98;font-weight:900}.hr .rc{color:#ffbf5a;font-weight:900}.hr .hl{color:#7dffa5;font-weight:900}.hr .pzc{color:#a6ff6a;font-weight:900}.hr .gd{color:#ffd36b;font-weight:900}.hr .bf{color:#8fc8ff;font-weight:900}
.hr .ar{opacity:.7}
.pop{position:fixed;z-index:70;pointer-events:none;font-weight:900;font-size:32px;-webkit-text-stroke:1.5px #000;text-shadow:0 3px 8px #000,0 0 18px currentColor;animation:popu 1.25s ease-out forwards;white-space:nowrap}
@keyframes popu{0%{transform:translate(-50%,0) scale(.5);opacity:0}15%{transform:translate(-50%,-10px) scale(1.35);opacity:1}100%{transform:translate(-50%,-64px) scale(1);opacity:0}}
.pop.dmg{color:#ff5b6b}.pop.heal{color:#6dffa0}.pop.pz{color:#b6ff5b}.pop.buf{color:#ffd24a;font-size:24px}.pop.txt{color:#fff;font-size:20px;-webkit-text-stroke:1px #000}.pop.gold{color:#ffd36b;font-size:26px}.pop.big{font-size:46px}
.ghostc{position:fixed;z-index:65;pointer-events:none;animation:ghostdie .8s ease-in forwards}
@keyframes ghostdie{0%{filter:none;transform:scale(1);opacity:1}40%{filter:brightness(2.4) saturate(0);transform:scale(1.07)}100%{transform:scale(.7) translateY(14px);opacity:0}}
.enter .ci{animation:enter .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes enter{0%{transform:scale(1.7) translateY(-30px);opacity:0}100%{transform:none;opacity:1}}
.shk{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.hero.shk{animation:shk .45s}
.banner{position:fixed;left:0;right:0;top:36%;z-index:75;text-align:center;pointer-events:none;font-family:var(--disp);font-size:44px;letter-spacing:.08em;text-shadow:0 4px 20px #000,0 0 30px var(--bc,#2ec4b6);color:#fff;animation:ban 1.5s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1.08)}75%{opacity:1}100%{opacity:0;transform:scale(1)}}
/* projectiles (missiles, sorts, venin, or) */
.proj{position:fixed;z-index:72;pointer-events:none;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,var(--pc) 45%,transparent 72%);box-shadow:0 0 18px 6px var(--pc);display:grid;place-items:center;font-size:18px}
.proj.ic{background:none;box-shadow:none;font-size:26px;filter:drop-shadow(0 0 8px var(--pc))}
.trail{position:fixed;z-index:71;pointer-events:none;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--pc);opacity:.7;animation:trail .45s ease-out forwards}
@keyframes trail{to{transform:scale(.1);opacity:0}}
.boom{position:fixed;z-index:72;pointer-events:none;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:4px solid var(--pc);box-shadow:0 0 30px var(--pc),inset 0 0 20px var(--pc);animation:boom .5s ease-out forwards}
@keyframes boom{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.5);opacity:0}}
/* annonce de famille / terrain au-dessus d'un plateau */
.fburst{position:fixed;z-index:74;pointer-events:none;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;padding:8px 22px 8px 10px;border-radius:99px;background:linear-gradient(90deg,var(--fc),color-mix(in srgb,var(--fc) 55%,#000));border:3px solid #fff;color:#111;font-family:var(--disp);font-size:26px;letter-spacing:.04em;box-shadow:0 0 40px var(--fc),0 10px 30px #000a;animation:fburst 1.7s ease-out forwards;white-space:nowrap}
.fburst .fi{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px}
.fburst small{font-family:'Inter',sans-serif;font-weight:800;font-size:14px;color:#111;opacity:.85}
@keyframes fburst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}24%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(.95)}}
/* carte jouée par l'adversaire, affichée en grand */
.castc{position:fixed;z-index:73;left:50%;top:44%;width:200px;pointer-events:none;transform:translate(-50%,-50%);animation:castc 1.6s ease-out forwards;filter:drop-shadow(0 20px 40px #000)}
.castc .lbl{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;background:#ff5d6c;color:#fff;font-weight:900;padding:3px 12px;border-radius:99px;font-size:13px}
@keyframes castc{0%{opacity:0;transform:translate(-50%,-30%) scale(.5) rotate(-6deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05) rotate(0)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.85)}}
.disc{position:absolute;left:0;right:0;top:56px;z-index:40;background:#c2364dee;text-align:center;padding:6px;font-size:13px;font-weight:700}
.disc button{margin-left:8px}

/* panneau de gauche : aperçu de carte, terrain ou famille */
#prev{width:270px;flex:none;padding:12px 14px;overflow:auto;border-right:2px solid #2b404b;background:#0a121699}
#prev .pn{font-family:var(--disp);font-size:20px;margin:10px 0 2px}

#prev .lore{font-size:12.5px}
#prev .tcard{width:150px;margin:0 auto 8px}
#prev h4{margin:6px 0 3px;font-size:17px;font-weight:900}

#prev .tp-b .btn{flex:1}
.fbadge{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,var(--gc),color-mix(in srgb,var(--gc) 45%,#000));border:2.5px solid #fff;box-shadow:0 6px 16px #000a,0 0 16px color-mix(in srgb,var(--gc) 55%,transparent);flex:none}
.dlist{display:grid;gap:6px;grid-template-columns:1fr 1fr}
.dl{display:flex;align-items:center;gap:8px;background:#0b141888;border:1.5px solid #ffffff1c;border-radius:12px;padding:4px 8px}
.dl .dc{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff1ff,#1aa3d8);color:#02202e;font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}

.dl .dn{flex:1;font-weight:700;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* déplacements : cases de destination, terrains déplaçables */
.slot.mvd{border-color:#5ee08a99;border-style:dashed;background:#5ee08a12}
.slot.mvd:hover,.slot.mvd.hov{background:#5ee08a3a;border-color:#5ee08a;border-style:solid}

.slot.swp:hover>.card .ci,.slot.swp.hov>.card .ci{outline-color:#5ee08a}
.tcell.own{cursor:grab}.tcell.own:active{cursor:grabbing}
.tcell.sel{box-shadow:0 0 0 2px #fff,0 0 12px var(--gc)}
.ghost.cr{width:84px;opacity:.8}
/* flèche de visée */
#aim{position:fixed;inset:0;pointer-events:none;z-index:79;display:none;color:#ffd36b}
#aim svg{position:absolute;inset:0;overflow:visible}
#aim .ab{fill:none;stroke:currentColor;stroke-width:14;stroke-linecap:round;opacity:.22}
#aim .al{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-dasharray:16 10;animation:aimdash .5s linear infinite;filter:drop-shadow(0 0 6px currentColor)}
#aim .ah{fill:currentColor;stroke:#0008;stroke-width:1.5;filter:drop-shadow(0 0 8px currentColor)}
#aim.snap .al{stroke-width:7}#aim.snap .ab{opacity:.35}
@keyframes aimdash{to{stroke-dashoffset:-26}}
/* fiche épinglée (clic droit) */
.cpop{position:fixed;z-index:86;width:620px;max-width:calc(100vw - 20px);background:linear-gradient(180deg,#1b2d36f8,#121d24f8);border:2px solid #3e6070;border-radius:18px;box-shadow:0 20px 50px #000d,0 0 0 1px #ffffff10;padding:10px 12px 12px;backdrop-filter:blur(4px)}
.cpop .cph{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:800;font-size:13px}
.cpop .cph .mut{flex:1;font-weight:600}
.cpop .x{width:28px;height:28px;border-radius:50%;background:#0b1418;border:2px solid #ffffff55;color:#fff;font-size:13px;display:grid;place-items:center;line-height:1}
.cpop .cpb{display:grid;grid-template-columns:210px 1fr;gap:14px;align-items:start}
.cpop .cpl .tcard{width:150px;margin:0 auto}
.cpop .cpr{max-height:min(74vh,620px);overflow:auto;padding-right:4px}
.cpop .pn{font-family:var(--disp);font-size:22px;margin:0 0 2px}
.cpop .pe{color:#ffd36b;font-style:italic;font-weight:700;font-size:13px;margin-bottom:4px}
.cpop .pd{font-size:13px;color:#d9e6eb;margin:5px 0;line-height:1.45}.cpop .pd b{color:#ffd36b}
.cpop .pd.txt{font-size:14px;color:#fff;background:#0b1418aa;border-radius:10px;padding:6px 9px}
.cpop .pd .kw,.cpop .kw{color:#ffd36b;font-weight:800;border-bottom:1px dotted #ffd36b99;cursor:help}
.cpop .lore{font-size:12.5px}
.cpop h4{margin:2px 0 4px;font-size:17px;font-weight:900}
.cpop .tp-l{display:grid;gap:5px;margin-top:8px}
.cpop .pv{display:flex;align-items:center;gap:8px;background:#0b141899;border:1.5px solid #ffffff22;border-radius:11px;padding:4px 8px;font-size:12.5px}
.cpop .pv img,.cpop .pv u{width:26px;height:26px;border-radius:50%;object-fit:cover;display:grid;place-items:center;text-decoration:none;background:#2b404b;flex:none}
.cpop .pv b{flex:1;min-width:0}.cpop .pv .gn{color:#7dffa5;font-weight:900}.cpop .pv .nn{color:#97adb8}
/* prismatique : fond irisé arc-en-ciel, façon lumière décomposée par un prisme */
.card.prism .ci{background:
  linear-gradient(115deg,#fff0 30%,#ffffffa0 46%,#fff0 60%) 0 0/300% 100% no-repeat,
  repeating-linear-gradient(115deg,#ffffff22 0 1.2cqw,#fff0 1.2cqw 3.4cqw),
  conic-gradient(from 200deg at 35% 25%,#ff8fc7,#ffad6e,#ffe96e,#8dffbc,#6fd8ff,#8fb2ff,#ff9fd8,#ff8fc7);
  background-size:300% 100%,auto,140% 140%;animation:prismbg 7s ease-in-out infinite}
@keyframes prismbg{0%{background-position:130% 0,0 0,0% 0%}50%{background-position:-30% 0,0 0,100% 100%}100%{background-position:130% 0,0 0,0% 0%}}
.card.prism .rr{color:#14212a;text-shadow:0 0 1.2cqw #fff,0 0 .4cqw #fff}
.card.prism .ct{background:linear-gradient(180deg,#0b1215cc,#121c22d6);box-shadow:inset 0 0 0 .4cqw #ffffff40}
.card.prism.bd .ci{background:#0a1013}
@media(prefers-reduced-motion:reduce){.card.prism .ci,.card .holo,.card .hgl,.card .spk,.card .pfr,.card .shn,.pk::after{animation:none}}
/* compteur de déplacements et coût affiché dans l'historique */
.rtx .mvc{background:#ffffff14;border:1px solid #ffffff30;border-radius:8px;padding:1px 7px;color:#bfe9ff;cursor:help}
.rtx .mvc.out{opacity:.6;color:#ffb3c0;border-color:#ff6b7a66}
.cst{margin-left:6px;font-size:11px;font-weight:800;color:#ffd36b;background:#ffffff14;border-radius:6px;padding:0 5px;white-space:nowrap}

/* ================= REFONTE LISIBILITÉ DU DUEL : zones colorées, hiérarchie, indicateur de tour ================= */
#duel{--sw:clamp(64px,min(calc((100vh - 535px)/3.74),calc((100vw - 700px)/6.25)),150px);--hw:max(84px,calc(var(--sw)*.84));
  background:radial-gradient(1100px 520px at 50% -8%,#ff5d6c24,transparent 70%),radial-gradient(1000px 520px at 50% 108%,#2ec4b62b,transparent 70%),linear-gradient(180deg,#0a0f13,#0b1217)}
@media(max-height:820px){#duel{--sw:clamp(64px,min(calc((100vh - 500px)/3.74),calc((100vw - 700px)/6.25)),150px)}}
.field>*{width:calc(var(--sw)*6 + 66px)}
.field{gap:6px;padding:8px 10px 6px}
/* zones : un fond et un liseré de couleur par camp */
.zone{border-radius:18px;padding:7px 9px;display:flex;flex-direction:column;gap:4px;position:relative;border:2px solid var(--zb);box-shadow:0 5px 16px #000a,inset 0 0 36px var(--zg);transition:box-shadow .3s,border-color .3s}
.zopp{--zb:#ff5d6c55;--zg:#ff5d6c14;background:linear-gradient(180deg,#46151d,#28090f)}
.zme{--zb:#2ec4b655;--zg:#2ec4b614;background:linear-gradient(180deg,#0b3138,#0a1f24)}
.zmid{--zb:#ffc14566;--zg:#ffc1451a;background:linear-gradient(180deg,#34270a,#1f1706);flex-direction:row;align-items:stretch;gap:8px;min-height:0;padding:6px 9px}
/* c'est ton tour : ta zone s'allume ; tour adverse : celle de l'adversaire */
#duel.myturn .zme{--zb:#2ec4b6;box-shadow:0 0 0 2px #2ec4b6aa,0 0 30px #2ec4b66b,0 5px 16px #000a,inset 0 0 36px #2ec4b62a}
#duel.oppturn .zopp{--zb:#ff5d6c;box-shadow:0 0 0 2px #ff5d6caa,0 0 30px #ff5d6c66,0 5px 16px #000a,inset 0 0 36px #ff5d6c26}
#duel.myturn .dtop{border-bottom-color:#2ec4b6}#duel.oppturn .dtop{border-bottom-color:#ff5d6c}
.dtop{border-bottom-width:3px}
/* héros : plus gros, ressources en pastilles colorées */
.hero{border-radius:14px;padding:6px 12px 6px 8px;gap:12px}
.hero.me{--hg1:#136670;--hg2:#0d3f47}.hero.opp{--hg1:#7a2230;--hg2:#4a1019}
.hav{width:46px;height:46px;font-size:22px;border-width:3px}
.hn{font-size:15px}
.hbar{height:22px;border-width:2px}.hbar span{font-size:14px}
.rtx{gap:6px;font-size:14px}
.rtx>span{padding:0 9px;border-radius:99px;background:#0008;border:1.5px solid #ffffff30;line-height:1.55}
.rtx .d{color:#8fe0ff;border-color:#3ec5ffaa;background:#06222e}.rtx .o{color:#ffd36b;border-color:#ffc145aa;background:#2d2308}
.rtx .mvc{color:#9fd0ff;border-color:#5fa8ffaa;background:#0a1d33}
.crys i{width:13px;height:16px}
.piles button{background:#000a;border-color:#ffffff3a;font-size:12.5px;color:#fff}
/* plateaux : cases bien visibles, teintées par camp */
.board{padding:2px}
.board.o,.board.m{background:none}
.slot{background:#0004;border:2px dashed #ffffff40}
.board.o .slot{border-color:#ff8d98aa;background:#ff5d6c14}
.board.m .slot{border-color:#5fe0d2aa;background:#2ec4b614}
.board.o .slot:not(.empty),.board.m .slot:not(.empty){border-style:solid;border-color:transparent;background:none}
/* bandes de terrains et synergies */
.tstrip{height:24px}
.tcell{font-size:11.5px;border-width:2px}
.tcell.none{border-color:#ffffff33;color:#ffffff55}
.fxrow{height:28px}
.fx{height:26px;font-size:12px}
/* zone du milieu : boutique de terrains + fin de tour */
.zmid .shopz{background:none;border:none;padding:0}
.zmid .evb{background:#0006;border-color:#ffc14566}
.shopz .lb{color:#ffd36b;font-size:10.5px}
.endb{min-width:128px;font-size:16px}
/* barre d'aide : seulement l'instruction du moment et ses boutons */
.info{min-height:0;flex-direction:row;align-items:center;gap:12px;padding:6px 12px;background:linear-gradient(180deg,#3a2c0b,#251b06);border:2px solid #ffc145aa;box-shadow:0 0 18px #ffc14544}
.info.empty{display:none}
.info .hintline{flex:1;font-size:14.5px;color:#fff1c4}
.info .acts{display:flex;gap:8px;flex:none}
@media(max-height:820px){.info{padding:3px 10px}.info:not(:has(.hintline)){display:none}}
/* main : un plateau sombre derrière les cartes */
.hand{background:linear-gradient(180deg,#0000,#07181c 55%);border-radius:14px}
/* panneau de gauche : fiche (bleu acier) */
#prev{width:276px;background:linear-gradient(180deg,#10243d,#0a1727);border-right:3px solid #2f5a96;box-shadow:inset -14px 0 28px #3d8bff12}
#prev::before{content:'FICHE';display:block;font-size:11px;letter-spacing:.2em;font-weight:900;color:#7fb8ff;margin:0 0 8px;padding-bottom:5px;border-bottom:2px solid #2f5a9688}
#prev .pd{color:#dbe8f5}
/* panneau de droite : historique (graphite) */
#hist{background:linear-gradient(180deg,#14191e,#0b0f12);border-left:3px solid #4a5a66}
.hh{background:#14191e}
.hh b{color:#fff;text-transform:uppercase;font-family:'Inter',sans-serif;font-weight:900;font-size:12.5px;letter-spacing:.2em}
.hrow{display:flex;align-items:center;gap:8px;min-width:0}
.hrow .hn{flex:1;min-width:0}
.hrow .piles{flex:none;gap:4px}
.hrow .piles button{padding:0 7px;font-size:12px;line-height:1.5}
.hinfo{min-width:150px}
.hrow .piles{background:#0008;border:1.5px solid #ffffff2e;border-radius:99px;padding:0 9px;gap:7px}
.hrow .piles button{background:none;border:0;padding:0;font-size:12px;border-radius:6px}
.hrow .piles button:not(.dk):hover{background:#ffffff22}

/* écrans de menu : chaque onglet a sa teinte (fond, liseré des panneaux) pour les distinguer d'un coup d'œil */
#view[data-t]{background:radial-gradient(1300px 360px at 50% -70px,color-mix(in srgb,var(--h) 22%,transparent),transparent 75%)}
.panel{border-top:3px solid color-mix(in srgb,var(--h) 75%,#2b404b)}
.panel h3{padding-bottom:10px;border-bottom:1px solid color-mix(in srgb,var(--h) 30%,transparent)}

/* ================= ÉCHANGES DE CARTES ================= */
.mbox.tradebox{max-width:1000px;width:min(1000px,96vw)}
.tstat{text-align:center;font-weight:800;font-size:15px;color:#ffe9a8;background:#3a2c0b;border:2px solid #ffc14577;border-radius:12px;padding:7px 12px;margin-bottom:10px}
.tw{display:grid;grid-template-columns:1fr 64px 1fr;gap:10px;align-items:stretch}
.tside{border-radius:18px;padding:12px 14px;border:2px solid var(--zb);background:linear-gradient(180deg,var(--z1),var(--z2));display:flex;flex-direction:column;align-items:center;gap:8px;min-height:430px;box-shadow:inset 0 0 36px var(--zg)}
.tside.me{--zb:#2ec4b6;--z1:#0b3138;--z2:#0a1f24;--zg:#2ec4b61f}
.tside.them{--zb:#ff5d6c;--z1:#46151d;--z2:#28090f;--zg:#ff5d6c1f}
.tside .tl{font-size:12px;letter-spacing:.2em;font-weight:900;text-transform:uppercase;color:var(--zb)}
.tside .tcw{width:210px;flex:none}
.tside .tempty{flex:1;display:grid;place-items:center;text-align:center;color:#ffffff88;border:2px dashed #ffffff3a;border-radius:14px;width:210px;font-weight:700;padding:12px}
.tinfo{width:100%;text-align:center}
.tinfo b{font-size:17px}
.tinfo .ttx{margin-top:4px;color:#e6f0f4;line-height:1.35}
.tinfo .tfs{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.tfoot{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:auto}
.tok{font-size:12.5px;font-weight:800;border-radius:99px;padding:3px 12px;background:#0007;border:1.5px solid #ffffff33;color:#ffffffaa}
.tok.on{color:#0b2a14;background:#6dffa0;border-color:#c9ffe0}
.tmid{display:grid;place-items:center;font-size:42px;color:#ffc145;text-shadow:0 0 18px #ffc14588}
.tgrid .cc2.sel .card .ci{box-shadow:0 0 0 2cqw #ffc145,0 0 6cqw #ffc145aa}
/* petits écrans : la zone reste assez large pour la barre du héros (nom, PV, ressources) même si les cases sont petites */
.field>*{width:max(calc(var(--sw)*6 + 66px),min(600px,100%))}
.board,.tstrip{width:calc(var(--sw)*6 + 30px);max-width:100%;margin-left:auto;margin-right:auto}

/* ================= DUEL v6 : relance des terrains ================= */
.rollb{flex:none;width:58px;border-radius:12px;border:2px solid #ffffff33;background:linear-gradient(180deg,#26333b,#182228);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900;padding:4px 2px;cursor:pointer}
.rollb .ri{font-size:22px;line-height:1}
.rollb small{font-size:12px;color:#ffd36b;white-space:nowrap}
.rollb.can:hover{border-color:#ffd36b;box-shadow:0 0 12px #ffc14566}
.rollb:active{transform:translateY(1px)}
.rollb[disabled]{opacity:.45;cursor:default}

/* ================= DUEL v6 : interface sobre, ressources séparées, effets de combat, terrains sur les cases ================= */
#duel{background:linear-gradient(180deg,#0a0f12,#0c1215);
  --sw:clamp(56px,min(calc((100vh - 474px)/3.797),calc((100vh - 602px)/2.52),calc((100vw - 700px)/6.25)),150px);--hw:max(84px,calc(var(--sw)*.84))}
.field{--zw:max(calc(var(--sw)*6 + 66px),min(600px,100%));overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
/* zones : même fond sombre partout, un simple liseré distingue les camps */
.zopp,.zme,.zmid{background:linear-gradient(180deg,#141c21,#0f161a)}
.zopp{--zb:#ff5d6c40;--zg:transparent}.zme{--zb:#2ec4b640;--zg:transparent}.zmid{--zb:#ffffff1c;--zg:transparent}
#duel.myturn .zme{--zb:#2ec4b6b0;box-shadow:0 0 0 1px #2ec4b655,0 0 20px #2ec4b62a,0 5px 16px #000a}
#duel.oppturn .zopp{--zb:#ff5d6cb0;box-shadow:0 0 0 1px #ff5d6c55,0 0 20px #ff5d6c2a,0 5px 16px #000a}
.board.o .slot,.board.m .slot{border-color:#ffffff2e;background:#ffffff05}
/* barre du haut : l'aide du moment remplace le titre (plus de barre qui pousse l'écran) ; chrono sobre */
.dtop{height:52px;flex:none}
.dtop .info{display:none}
.dtop.hashint .tt{display:none}
.dtop.hashint .info{display:flex;flex:1;min-width:0;justify-content:center;align-items:center;gap:12px;background:none;border:0;box-shadow:none;padding:0;position:static}
.dtop .info .hintline{flex:0 1 auto;min-width:0;font-size:15px;color:#ffd36b;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtop .info .acts{display:flex;gap:8px;flex:none}
.dtop .tm.lo{animation:none;box-shadow:none;background:#3a0d14;color:#ff8a98;border-color:#ff4d5e}
.dtop .tm.mid{box-shadow:none}
/* héros : identité + PV épurés, puis une case par ressource */
.hero{background:#0d1418;border:1.5px solid #ffffff1f;gap:0;padding:6px 8px;border-radius:14px;align-items:stretch;box-shadow:0 3px 10px #0008}
.hero.me,.hero.opp{--hg1:#0d1418;--hg2:#0d1418}
.hero.me .hav{border-color:#2ec4b6}.hero.opp .hav{border-color:#ff5d6c}
.hero.act{border-color:#ffffff4d;box-shadow:0 3px 10px #0008}
.hav{align-self:center;margin-right:10px;width:44px;height:44px;font-size:20px}
.hid{flex:1;min-width:150px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding-right:12px}
.hid .hrow .hn{font-size:14.5px}
.hpl{display:flex;align-items:center;gap:10px}
.hpl .hbar{flex:1;height:8px;border-radius:99px;background:#ffffff14;border:0;margin:0;overflow:hidden;position:relative}
.hpl .hbar i{position:absolute;left:0;top:0;bottom:0;background:#e5484d;border-radius:99px;transition:width .5s}
.hero.low .hpl .hbar i{background:#ff2e3e;box-shadow:0 0 8px #ff2e3e}
.hpn{font-size:17px;font-weight:900;white-space:nowrap;color:#fff;line-height:1}.hpn i{font-style:normal;color:#ff6b6b}.hpn small{font-size:12px;color:#8ea2ac;font-weight:700}
.hst{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px;border-left:1px solid #ffffff1a;min-width:60px;position:relative;cursor:default}
/* le nom de chaque case (Démoflux, Or, Main...) n'apparaît qu'au survol */
.hst .hl,.hpl .hl{position:absolute;left:50%;bottom:calc(100% + 7px);transform:translate(-50%,3px);background:#0b1013;border:1px solid #ffffff59;border-radius:8px;padding:3px 9px;
  font-size:11.5px;letter-spacing:.03em;font-weight:800;color:#fff;white-space:nowrap;line-height:1.35;opacity:0;pointer-events:none;transition:opacity .12s,transform .12s;z-index:30;box-shadow:0 4px 14px #000b}
.hero.opp .hst .hl,.hero.opp .hpl .hl{bottom:auto;top:calc(100% + 7px);transform:translate(-50%,-3px)}
.hst:hover .hl,.hpl:hover .hl{opacity:1;transform:translate(-50%,0)}
.hpl{position:relative}
.hst b{font-size:17px;font-weight:900;white-space:nowrap;line-height:1.25;color:#fff}.hst b small{font-size:12px;color:#8ea2ac;font-weight:700}
.hst b i{font-style:normal}.hst.mana b i{color:#5fd0ff}.hst.mvc b i{color:#8ec5ff}
.hst.mvc{cursor:help}.hst.mvc.out{opacity:.5}
.hst .crys{max-width:118px;margin-top:2px;justify-content:center}.hst .crys i{width:9px;height:11px}
@media(max-height:820px){.hst .crys{display:none}}
/* familles : seul le signe est en couleur */
.fx{background:#0d1418;border:1.5px solid #ffffff22;color:#dfe9ee}
.fx .fi{background:color-mix(in srgb,var(--fc) 80%,#000);border:1px solid #ffffff55}
.fx .pp i{background:#ffffff1f;border-color:#ffffff3a}.fx .pp i.f{background:#fff;border-color:#fff}
.fx.on{background:#0d1418;color:#fff;border-color:#ffffff5c;box-shadow:none}
.fx.on .fi{background:var(--fc);color:#000;box-shadow:0 0 10px var(--fc)}
.fx .tag{background:#ffffff1a;color:#fff}
/* cartes posées : pas de familles */
.card.bd .fc{display:none}
/* ATK et PV : exactement la même pastille (même couleur), quel que soit l'état de la créature */
.card .st .at,.card .st .hpv,.card .st b.up,.card .st b.dn,.card .st b.hurt{background:linear-gradient(180deg,#3b4a52,#151e23);color:#fff;border-color:#000c;box-shadow:inset 0 0 0 .5cqw #ffffff38,0 .5cqw 1.5cqw #000a}
/* cases couvertes par un terrain : elles prennent sa couleur */
.board .slot.ter{border:2px solid color-mix(in srgb,var(--tc) 85%,#fff 8%);background:color-mix(in srgb,var(--tc) 20%,transparent)}
.board .slot.ter:not(.empty){box-shadow:0 0 0 2px var(--tc),0 0 12px color-mix(in srgb,var(--tc) 50%,transparent)}
.board .slot.ter.mvd{background:color-mix(in srgb,var(--tc) 30%,#5ee08a22)}
/* effets de combat sur les cartes du plateau */
.card .vfx{position:absolute;inset:0;pointer-events:none;z-index:4;border-radius:inherit;overflow:hidden}
.card .vfx i{position:absolute;inset:0;display:none;border-radius:inherit}
.card.bd.eg .v-eg{display:block;background:linear-gradient(125deg,#ffffff4a 0%,#ffffff10 20%,#fff0 32%,#fff0 62%,#ffffff1c 72%,#fff0 84%);box-shadow:inset 0 0 0 1.4cqw #e3f7ffd0,inset 0 0 7cqw #9fe8ff70}
.card.bd.eg .v-eg::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,#fff0 40%,#ffffffb0 48%,#fff0 56%) 0 0/300% 100% no-repeat;animation:glass 3.2s ease-in-out infinite}
@keyframes glass{0%,25%{background-position:130% 0}75%,100%{background-position:-30% 0}}
.card.bd.tlt .v-tlt{display:block;background:radial-gradient(120% 70% at 50% 108%,#ff2b2bcc,#ff2b2b40 45%,#ff2b2b00 70%);opacity:.55;animation:vpulse 2.4s ease-in-out infinite}
.card.bd.tlton .v-tlt{opacity:1;background:radial-gradient(130% 85% at 50% 112%,#ff1f1ff0,#ff2b2b70 50%,#ff2b2b00 80%),radial-gradient(90% 45% at 50% -5%,#ff2b2b55,#ff2b2b00)}
@keyframes vpulse{50%{filter:brightness(1.4)}}
.card.bd.pzn .v-pzn{display:block;background:linear-gradient(0deg,#7dff3a90,#7dff3a26 40%,#7dff3a00 66%);animation:vpulse 2s ease-in-out infinite}
.card.bd.blkx .v-blk{display:block;background:linear-gradient(135deg,#d8f3ff70,#7cc8ff30 40%,#d8f3ff60);box-shadow:inset 0 0 9cqw #d8f3ffd0}
.card.bd.afkx .ci{filter:grayscale(1) brightness(.75)}
.card.bd.afkx .ca::after{content:'💤';position:absolute;right:5cqw;top:26cqw;font-size:17cqw;z-index:5;animation:floaty 1.8s ease-in-out infinite}
.card.bd.noatk .ca img,.card.bd.noatk .ca .sy{filter:grayscale(.9) brightness(.8)}

// ---------- familles, terrains, statistiques ----------
// fl : nombre de créatures de chaque famille sur le plateau
function fl(G,s){const n={};for(const c of G.p[s].board)if(c)for(const f of CARDS[c.k].fac)n[f]=(n[f]||0)+1;return n}
function terrOf(G,s,i){const P=G.p[s],id=P.cells[i];if(!id)return null;for(const t of P.terrs)if(t.id===id)return t;return null}
function tfx(T,k){if(!T)return null;const t=TD[T.d];return t.e[affOf(k,t.g)]||null}
// terrain de jeu = WoW, Dofus, LoL ou CS ; les autres terrains sont neutres
function isGT(T){return!!T&&TD[T.d].g!=='bazar'}
function tgOf(G,s,i){const T=terrOf(G,s,i);return T?TD[T.d].g:null}
// affinité d'une créature en jeu (Maki, chef coach : +1 d'affinité LoL, 2 maximum)
function affC(c,g){if(g==='bazar')return 1;let a=affOf(c.k,g);if(g==='lol'&&c.lb)a=Math.min(2,a+c.lb);return a}
function tfxC(T,c){if(!T)return null;const t=TD[T.d];return t.e[affC(c,t.g)]||null}
// Elkatrix (doux comme un agneau) : les effets des terrains LoL de son camp s'appliquent deux fois
function tMul(G,s,T){if(!T||TD[T.d].g!=='lol')return 1;for(const b of G.p[s].board)if(b&&!b.mut&&CARDS[b.k].dblLol)return 2;return 1}
function runT(G,s,T,l,x){const n=tMul(G,s,T);for(let j=0;j<n&&!G.over;j++)runFx(G,l,x)}
// auras des créatures en jeu (Xulyes, Minuit, Homz, Saja) : bonus reçu par la créature c en (s,i)
function auraOf(G,s,i,c){let a=0,h=0;
  for(const t of[0,1]){const B=G.p[t].board;for(let j=0;j<CELLS;j++){const b=B[j];if(!b||b.mut)continue;const au=CARDS[b.k].aura;if(!au)continue;
    if(au.pos){if(t===s&&j===i)continue;if(i<j){a--;h--}else if(i>j){a++;h++}continue}   // Saja : à sa gauche -1/-1, à sa droite +1/+1, sur les deux plateaux
    if(t!==s||(au.others&&j===i))continue;
    if(au.g&&tgOf(G,s,i)!==au.g)continue;if(au.fac&&!hasF(c.k,au.fac))continue;

// une aura qui disparaît ne tue pas : les PV qu'elle donnait sont retirés des dégâts subis d'abord
function auraOff(G,s,i){const src=G.p[s].board[i];if(!src||src.mut||!CARDS[src.k].aura)return;
  const before=[[],[]];for(const t of[0,1])G.p[t].board.forEach((c,j)=>{before[t][j]=c?auraOf(G,t,j,c).h:0});
  const sv=src.mut;src.mut=1;
  for(const t of[0,1])G.p[t].board.forEach((c,j)=>{if(!c||c===src)return;const d=before[t][j]-auraOf(G,t,j,c).h;if(d>0)c.dm=Math.max(0,c.dm-d)});

function xenoAll(G,s){return G.p[s].board.some(b=>b&&!b.mut&&CARDS[b.k].xenoAll)}
function kwOf(G,s,c,L,TE,T){
  const cd=CARDS[c.k],r={};if(!c.mut&&cd.kw)for(const x of cd.kw)r[x]=1;

  if(c.ds)r.deso=1;                                                  // Désorienté (Lanfear) : un état, il reste même Mute
  if(!c.mut&&cd.onT&&T&&TD[T.d].g===cd.onT.g)for(const x of cd.onT.kw)r[x]=1;   // mots-clés gagnés sur un terrain d'un jeu (Lisdoon, Roro)
  if(!c.mut&&cd.offGT&&!isGT(T))for(const x of cd.offGT.kw)r[x]=1;             // ... hors d'un terrain de jeu (Lisdoon, Gomuscu)

  if(T&&!c.mut&&cd.gr&&cd.gr.g===TD[T.d].g){a+=cd.gr.a;h+=cd.gr.h}

    o.t==='grow'?(o.a+o.h)*1.1:o.t==='healSelf'?Math.min(o.n,4)*.4:o.t==='dmgFace'?o.n*.9:o.t==='draw'?1.5:o.t==='egide'?1.6:o.t==='buff'?(o.a+o.h):.5;return s};

function hidden(E,c){return(E.kw.afk&&!c.aw)||c.ex}

// ---------- cibles ----------
function targets(G,s,spec,tgf,exc){
  const r=[],e=1-s;
  const hero=sd=>r.push({s:sd,i:-1});
  const cr=sd=>{const L=fl(G,sd);G.p[sd].board.forEach((c,i)=>{if(!c||c.id===exc)return;const E=eff(G,sd,i,L);
    if(E.kw.afk&&!c.aw)return;if(sd!==s&&(c.ex||E.kw.insolence))return;if(tgf==='hurt'&&c.dm<=0)return;if(tgf==='c2'&&CARDS[c.k].c>2)return;r.push({s:sd,i})})};
  switch(spec){case 'any':hero(s);hero(e);cr(s);cr(e);break;case 'e':hero(e);cr(e);break;case 'c':cr(s);cr(e);break;
    case 'ec':cr(e);break;case 'ac':cr(s);break}

// VIP : attaquable seulement quand il n'y a plus que des VIP sur son plateau ; Maki (aristocrate) : il faut 1 Or pour l'attaquer
function atkTargets(G,s){

  const Es=B.map((c,i)=>c?eff(G,e,i,L):null),vipOnly=B.every((c,i)=>!c||Es[i].kw.vip);
  B.forEach((c,i)=>{if(!c)return;const E=Es[i];if(hidden(E,c))return;if(E.kw.vip&&!vipOnly)return;

  const E=eff(G,s,i);if(E.a<=0||(E.TE&&E.TE.noAtk))return false;if(c.sick&&!E.kw.hate)return false;return c.af<(E.kw.frenesie?2:1)+(c.xat||0)}
function costOf(G,s,h){return CARDS[h.k].c}
function cryTg(cd){if(cd.t==='s')return cd.tg?{tg:cd.tg,tgf:cd.tgf}:null;
  const l=cd.cry;if(!l)return null;for(const o of l)if(o.tg)return{tg:o.tg,tgf:o.tgf,tg2:o.tg2};return null}
// 2e cible (Lasorius, instigateur) : une de tes créatures, ou la case où il arrive (lui-même)
function tg2List(G,s,sl){const r=targets(G,s,'ac');if(sl!=null)r.push({s,i:sl});return r}
function playable(G,s,i){

// ---------- déplacements : coût et plafond ----------
// Une créature déplacée (ou échangée) coûte du Démoflux, un terrain déplacé coûte de l'Or. Le n-ième déplacement du tour coûte n.
// Le plafond par tour se règle dans les options du défi (mv : 0 = interdits).
function mvMax(G){return G.o.mv==null?2:G.o.mv}
function mvCost(G,s){return 1+(G.p[s].mvn||0)}
function mvLeft(G,s){return Math.max(0,mvMax(G)-(G.p[s].mvn||0))}
function canMoveC(G,s){return!G.over&&G.cur===s&&mvLeft(G,s)>0&&G.p[s].eth>=mvCost(G,s)}
function canMoveT(G,s){return!G.over&&G.cur===s&&!!G.o.ter&&mvLeft(G,s)>0&&G.p[s].or>=mvCost(G,s)}

// ---------- dégâts, soins, pioche ----------

// cimetière : sorts joués, créatures mortes, cartes défaussées ou brûlées (les jetons n'y vont pas)
function toGrave(P,c){if(c&&!CARDS[c.k].tok)P.grave.push({k:c.k,id:c.id,p:c.p})}

function moveCtl(G,fs,fi,ts,ti){const c=G.p[fs].board[fi];if(!c||G.p[ts].board[ti])return null;auraOff(G,fs,fi);G.p[fs].board[fi]=null;

// ---------- morts ----------
function checkOver(G){
  if(G.over)return;const a=G.p[0].hp<=0,b=G.p[1].hp<=0;
  if(a||b)G.over={w:a&&b?-1:(a?1:0)}}
function reap(G){
  if(G.rp)return;G.rp=1;
  try{for(let it=0;it<60;it++){
    let d=null;
    outer:for(const s of [G.cur,1-G.cur]){const L=fl(G,s);for(let i=0;i<CELLS;i++){const c=G.p[s].board[i];if(c){const E=eff(G,s,i,L);if(E.hp<=0){d={s,i,c,E};break outer}}}}
    if(!d)break;
    const{s,i,c,E}=d,cd=CARDS[c.k],P=G.p[s];
    if(E.h>0&&(c.inv||(!c.mut&&cd.save1&&!c.sv))){                             // Gobi : la première fois, il reste à 1 PV et devient invincible
      if(!c.inv){c.sv=1;c.inv=1;lg(G,{t:'save',ts:s,i,k:c.k})}c.dm=Math.max(0,E.h-1);continue}
    removeC(G,s,i,false);if(!c.sm)toGrave(P,c);
    const onLol=!!E.T&&TD[E.T.d].g==='lol',oppT=G.cur!==s;
    P.board.forEach((b,j)=>{if(!b||b.mut)return;const bd=CARDS[b.k];
      if(onLol&&bd.allyDieLol){b.a+=bd.allyDieLol.a;b.h+=bd.allyDieLol.h;lg(G,{t:'buff',ts:s,i:j,k:b.k,ba:bd.allyDieLol.a,bh:bd.allyDieLol.h})}
      if(oppT&&bd.xatk){b.xa=(b.xa||0)+1;lg(G,{t:'xa',ts:s,i:j,k:b.k,n:b.xa})}});
    const x={s,src:c.k,self:c,tg:null,pc:G.played,sl:i,ss:s,si:i};
    if(!c.mut&&cd.last)runFx(G,cd.last,x);
    if(E.TE&&E.TE.last&&!G.over){lg(G,{t:'tfx',ts:s,i,d:E.T.d,k:c.k});runT(G,s,E.T,E.TE.last,Object.assign({},x,{src:'T:'+E.T.d}))}
    if(E.kw.respawn&&!c.rs&&!G.over&&!P.board[i]){
      const gi=P.grave.findIndex(q=>q.id===c.id);if(gi>=0)P.grave.splice(gi,1);
      const n=mkC(G,c.k,c.p);n.a=c.a;n.h=c.h;n.rs=1;n.sick=1;n.sm=c.sm;n.mut=c.mut;P.board[i]=n;
      if(!cd.rsFull){const E2=eff(G,s,i);n.dm=Math.max(0,E2.h-1)}
      lg(G,{t:'sum',ts:s,i,k:c.k,rs:1})}
  }}finally{G.rp=0}
  checkOver(G);flushTilt(G)}

// ---------- effets ----------
function cond(G,c,x){
  if(c.has){const B=G.p[x.s].board;return B.some(b=>b&&CARDS[b.k].base===c.has&&(!x.self||b.id!==x.self.id))}
  if(c.comb)return G.played>0;
  if(c.ter||c.gt||c.ngt){const i=selfI(G,x),T=i>=0?terrOf(G,x.s,i):null;if(c.ter)return!!T&&TD[T.d].g===c.ter;if(c.gt)return isGT(T);return!isGT(T)}
  return true}
function sides(op,x){return op.both?[0,1]:[x.s]}
function allEnemy(G,s){const r=[{s:1-s,i:-1}];G.p[1-s].board.forEach((c,i)=>{if(c)r.push({s:1-s,i})});return r}

function hasEth(k){const cd=CARDS[k];return cd.t==='s'&&cd.fx.some(o=>o.t==='eth')}

  if(W.mode&&M.some(m=>m.t==='atk'))best.v-=1e3;      // les modes forcés attaquent toujours

    if(m.t==='move')v-=mvCost(G,s)*(W.lam+.5);           // le Démoflux d'un déplacement n'est pas « gratuit » : il aurait pu servir à jouer une carte
    else if(m.t==='tmove')v-=mvCost(G,s)*.3;             // (l'Or dépensé est déjà compté par evalG)

// courbe visée pour 30 cartes
const CURVE=[[1,2,9],[3,4,11],[5,6,6],[7,99,4]];
function autoDeck(coll,arch,size,rs){
  size=size||ECON.deck;const A=ARCH[arch]||ARCH.rush,out=[],cnt={};let r0=rs||0;
  const jit=()=>{r0=(r0*9301+49297)%233280;return r0/233280};
  const sc={};POOL.forEach(k=>sc[k]=cardScore(k,A)+(rs?jit()*2.5:0));
  const avail=POOL.filter(k=>availOf(coll,k)>0).sort((a,b)=>sc[b]-sc[a]);
  const add=k=>{if(out.length>=size||(cnt[k]||0)>=availOf(coll,k))return false;cnt[k]=(cnt[k]||0)+1;out.push(k);return true};
  const bucket=c=>CURVE.findIndex(b=>c>=b[0]&&c<=b[1]);
  const inB=b=>out.filter(k=>bucket(CARDS[k].c)===b).length;
  const spells=()=>out.filter(k=>CARDS[k].t==='s').length;
  // 1) on remplit chaque tranche de coût avec les meilleures cartes
  for(let b=0;b<CURVE.length;b++)for(const k of avail){if(inB(b)>=CURVE[b][2])break;if(bucket(CARDS[k].c)!==b)continue;
    if(CARDS[k].t==='s'&&spells()>=9)continue;add(k);if(inB(b)<CURVE[b][2])add(k)}

  for(let r=0;r<2&&out.length<size;r++)for(const k of avail){if(CARDS[k].t==='s'&&spells()>=11)continue;add(k)}

// ----- boosters : 5 cartes ; 3 boosters d'un coup = au moins une Rare (ou mieux) garantie -----
function rollRar(odds){let r=Math.random()*100,a=0;for(let i=1;i<odds.length;i++){a+=odds[i];if(r<a)return i}return odds.length-1}
function rollCard(rar){const pool=POOL.filter(k=>CARDS[k].r===rar);return pool[Math.floor(Math.random()*pool.length)]}
// n paquets ; renvoie un tableau de paquets (chacun : liste de {k,p,rar,isNew}) ou null si pas assez de 💎
function buyBoosters(n,prism){
  const price=(prism?ECON.prism:ECON.booster)*n;if(S.gems<price)return null;S.gems-=price;
  const odds=prism?ECON.podds:ECON.odds,seen={},packs=[];
  for(let b=0;b<n;b++){const pk=[];
    for(let i=0;i<ECON.pack;i++){const rar=rollRar(odds);pk.push({rar,k:null,p:prism?1:0})}
    packs.push(pk)}
  // garanties : un paquet prismatique ou un lot de 3 contient au moins une Rare ou mieux
  if(prism||n>=ECON.bulk){const all=packs.flat();if(!all.some(c=>c.rar>=2)){const c=all[Math.floor(Math.random()*all.length)];c.rar=2}}
  for(const pk of packs)for(const c of pk){c.k=rollCard(c.rar);c.isNew=ownedN(c.k)===0&&!seen[c.k];seen[c.k]=1;addCard(c.k,c.p)}
  // les paquets sont triés du moins rare au plus rare pour une révélation qui monte en tension
  packs.forEach(pk=>pk.sort((a,b)=>a.rar-b.rar));
  saveS();return packs}
