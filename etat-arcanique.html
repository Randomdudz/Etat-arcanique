  const H={G,seats,sent:[0,0],dl:0,timer:null,aiT:null,stop:false};
  const lim=()=>G.o.tim|0;
  H.view=side=>{const V=view(G,side,H.sent[side]);H.sent[side]=G.hist.length;V.tl=H.dl?Math.max(0,H.dl-Date.now()):0;V.tim=G.phase==='mull'?Math.min(lim(),MULLT):lim();return V};
  H.push=()=>{seats.forEach((s,i)=>{
    if(s.kind==='me'){try{onMe(H.view(i))}catch(e){console.error(e)}}else if(s.kind==='net'&&s.send)s.send({t:'st',v:H.view(i)})})};
  H.arm=()=>{clearTimeout(H.timer);H.dl=0;if(!lim()||G.over||H.stop)return;
    // mulligan : à la fin du temps, ceux qui n'ont pas choisi gardent leur main
    if(G.phase==='mull'){const mt=Math.min(lim(),MULLT);H.dl=Date.now()+mt*1000;
      H.timer=setTimeout(()=>{if(G.over||G.phase!=='mull'||H.stop)return;for(const s of[0,1])if(G.phase==='mull'&&!G.mull[s])act(G,s,{t:'mull',idx:[]});H.after(300)},mt*1000+250);return}
    H.dl=Date.now()+lim()*1000;const c=G.cur,tn=G.turn;
    H.timer=setTimeout(()=>{if(G.over||G.cur!==c||G.turn!==tn||H.stop)return;act(G,c,{t:'end'});H.after(300)},lim()*1000+250)};
  H.after=(delay)=>{
    if(H.stop)return;
    if(H.lastTurn!==G.turn){H.lastTurn=G.turn;H.arm()}
    H.push();
    if(G.over){clearTimeout(H.timer);clearTimeout(H.aiT);return}
    if(!G.phase&&seats[G.cur].kind==='ai'){clearTimeout(H.aiT);H.aiT=setTimeout(H.aiStep,delay==null?700:delay)}};
  // délai avant l'action suivante de l'IA : assez long pour laisser jouer les animations produites
  const pace=(n0,base)=>{let w=0;for(let i=n0;i<G.hist.length;i++){const t=G.hist[i].t;w+=t==='fac'||t==='play'&&G.hist[i].ts!==0?550:t==='dmg'||t==='pz'||t==='gold'?260:t==='atk'?480:t==='tfx'||t==='chaos'||t==='story'?280:t==='move'||t==='tmove'?420:80}
    return Math.min(4200,base+w)};
  H.aiStep=()=>{
    if(H.stop||G.over||G.phase)return;const s=G.cur;if(seats[s].kind!=='ai')return;
    const n0=G.hist.length,m=aiPick(G,s,seats[s].W);const r=act(G,s,m);if(!r.ok)act(G,s,{t:'end'});
    H.after(pace(n0,m.t==='end'?400:600))};
  H.act=(side,a)=>{
    if(H.stop)return{ok:false,err:'Partie fermée.'};
    const n0=G.hist.length,r=act(G,side,a);
    if(!r.ok){const s=seats[side];if(s.kind==='net'&&s.send)s.send({t:'err',m:r.err});return r}
    H.after(pace(n0,a.t==='end'?700:500));return r};
  H.resign=side=>{if(!G.over){act(G,side,{t:'resign'});H.after(0)}};
  H.close=()=>{H.stop=true;clearTimeout(H.timer);clearTimeout(H.aiT)};
  H.start=()=>{H.lastTurn=G.turn;H.arm();H.push();
    // mulligan de l'IA, après un petit temps de réflexion
    if(G.phase==='mull'){seats.forEach((st,i)=>{if(st.kind==='ai')setTimeout(()=>{if(H.stop||G.phase!=='mull'||G.mull[i])return;act(G,i,{t:'mull',idx:aiMull(G,i)});H.after(500)},1800+Math.random()*1800)});return}
    if(seats[G.cur].kind==='ai')H.aiT=setTimeout(H.aiStep,1200)};
  return H}

// ---------- réseau ----------
const NET={peer:null,ok:false,err:'',tries:{},cb:null};
function netStart(onChange){
  NET.cb=onChange||function(){};
  if(typeof Peer==='undefined'){NET.err='Mode en ligne indisponible (PeerJS non chargé : vérifie ta connexion).';NET.cb();return}
  try{NET.peer=new Peer(peerId(S.code),{debug:0})}catch(e){NET.err='Connexion impossible.';NET.cb();return}
  const P=NET.peer;
  P.on('open',()=>{NET.ok=true;NET.err='';NET.cb()});
  P.on('connection',onIncoming);
  P.on('disconnected',()=>{NET.ok=false;NET.cb();setTimeout(()=>{try{P.reconnect()}catch(e){}},2500)});
  P.on('close',()=>{NET.ok=false;NET.cb()});
  P.on('error',e=>{
    if(e.type==='unavailable-id'){NET.err='Ton profil est déjà ouvert dans un autre onglet.';NET.cb();return}
    if(e.type==='peer-unavailable'){const m=String(e.message||'').match(/etat-arcanique-[a-z0-9]+/);if(m&&NET.tries[m[0]])NET.tries[m[0]]();return}
    if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){NET.err='Serveur de rencontre injoignable…';NET.cb()}})}
function netReady(){return NET.peer&&NET.ok}
// présence d'un ami : on tente de se connecter à son profil
function pingFriend(code,cb){
  if(!netReady())return cb(null);
  const id=peerId(code);let done=false,c=null;
  const fin=v=>{if(done)return;done=true;clearTimeout(t);delete NET.tries[id];try{c&&c.close()}catch(e){}cb(v)};
  const t=setTimeout(()=>fin(false),5500);NET.tries[id]=()=>fin(false);
  try{c=NET.peer.connect(id,{reliable:true})}catch(e){return fin(false)}
  c.on('open',()=>{try{c.send({t:'ping'})}catch(e){fin(false)}});
  c.on('data',m=>{if(m&&m.t==='pong')fin(m)});c.on('error',()=>fin(false))}

// connexion entrante : ping, ou défi
function onIncoming(c){
  c.on('data',m=>{
    if(!m||!m.t)return;
    if(m.t==='ping'){try{c.send({t:'pong',name:S.name,busy:!!window.DUEL})}catch(e){}return}
    if(m.t==='chal'){
      if(window.DUEL||window.CHALLENGE_UI||window.TRADE_UI){try{c.send({t:'busy'})}catch(e){}return}
      if(typeof onChallenge==='function')onChallenge(c,m);return}
    if(m.t==='trade'){                                   // proposition d'échange de cartes
      if(window.DUEL||window.CHALLENGE_UI||window.TRADE_UI){try{c.send({t:'busy'})}catch(e){}return}
      if(typeof onTrade==='function')onTrade(c,m)}})}

// côté challenger : envoie le défi et attend la réponse
function sendChallenge(friend,deckInfo,opt,cbs){
  if(!netReady()){cbs.fail('Connexion au serveur de rencontre en cours… réessaie dans un instant.');return null}
  const id=peerId(friend.code);let c=null,done=false;
  const fail=m=>{if(done)return;done=true;clearTimeout(t);delete NET.tries[id];try{c&&c.close()}catch(e){}cbs.fail(m)};
  const t=setTimeout(()=>fail(friend.name+' est hors ligne (ou n’a pas ouvert le jeu).'),9000);
  NET.tries[id]=()=>fail(friend.name+' est hors ligne (ou n’a pas ouvert le jeu).');
  try{c=NET.peer.connect(id,{reliable:true})}catch(e){fail('Connexion impossible.');return null}
  c.on('open',()=>{clearTimeout(t);delete NET.tries[id];c.send({t:'chal',name:S.name,code:S.code,o:opt,ver:APPV})});
  c.on('data',m=>{
    if(!m)return;
    if(m.t==='busy'){done=true;cbs.fail(friend.name+' est déjà occupé(e).');try{c.close()}catch(e){}}
    else if(m.t==='dec'){done=true;cbs.fail(friend.name+' a refusé le défi.');try{c.close()}catch(e){}}
    else if(m.t==='acc'){done=true;cbs.accepted(c,m)}});
  c.on('error',()=>fail('Erreur de connexion.'));
  c.on('close',()=>{if(!done)fail('La connexion a été coupée.')});
  return{cancel:()=>{done=true;clearTimeout(t);delete NET.tries[id];try{c.close()}catch(e){}}}}

// côté initiateur d'un échange : envoie la proposition et attend la réponse (accepté / refusé / occupé)
function sendTrade(friend,cbs){
  if(!netReady()){cbs.fail('Connexion au serveur de rencontre en cours… réessaie dans un instant.');return null}
  const id=peerId(friend.code);let c=null,done=false;
  const off=friend.name+' est hors ligne (ou n’a pas ouvert le jeu).';
  const fail=m=>{if(done)return;done=true;clearTimeout(t);delete NET.tries[id];try{c&&c.close()}catch(e){}cbs.fail(m)};
  const t=setTimeout(()=>fail(off),9000);NET.tries[id]=()=>fail(off);
  try{c=NET.peer.connect(id,{reliable:true})}catch(e){fail('Connexion impossible.');return null}
  c.on('open',()=>{clearTimeout(t);delete NET.tries[id];try{c.send({t:'trade',name:S.name,code:S.code,ver:APPV})}catch(e){fail('Erreur de connexion.')}});
  c.on('data',m=>{
    if(!m||done)return;
    if(m.t==='busy'){done=true;cbs.fail(friend.name+' est occupé(e) (duel ou autre échange).');try{c.close()}catch(e){}}
    else if(m.t==='dec'){done=true;cbs.fail(friend.name+' a refusé l’échange.');try{c.close()}catch(e){}}
    else if(m.t==='tacc'){done=true;cbs.accepted(c,m)}});
  c.on('error',()=>fail('Erreur de connexion.'));
  c.on('close',()=>{if(!done)fail('La connexion a été coupée.')});
  return{cancel:()=>{done=true;clearTimeout(t);delete NET.tries[id];try{c.send({t:'tcancel'})}catch(e){}try{c.close()}catch(e){}}}}

// ============ ÉCHANGES DE CARTES ENTRE AMIS ============
// Une offre est {k,p} : la carte (clé) et p=1 pour un exemplaire prismatique, p=0 pour un exemplaire normal.
// Chaque joueur choisit UNE carte à donner ; les deux joueurs voient les deux cartes ; l'échange n'a lieu que quand
// les deux ont validé exactement la même paire. Toute modification d'une offre annule les validations.
function offerOk(o){return!!o&&typeof o.k==='string'&&!!CARDS[o.k]&&POOL.indexOf(o.k)>=0&&(o.p===0||o.p===1)}
function cleanOffer(o){return offerOk(o)?{k:o.k,p:o.p}:null}
function sameOffer(a,b){return!!a&&!!b&&a.k===b.k&&a.p===b.p}
function hasCopy(o,st){const e=(st||S).coll[o.k];return!!e&&(o.p?e.p>0:e.n>0)}
// decks : on retire l'exemplaire donné des decks qui en contenaient plus que ce que le joueur possède encore (carte `only`)
function fixDecks(st,only){st=st||S;const out=[];
  for(const d of st.decks){const cnt={};d.cards.forEach(e=>{const k=String(e).replace('*','');cnt[k]=(cnt[k]||0)+1});let lost=0;
    for(const k in cnt){if(only&&k!==only)continue;const e=st.coll[k]||{n:0,p:0};let ex=cnt[k]-(e.n+e.p);
      for(let i=d.cards.length-1;i>=0&&ex>0;i--)if(String(d.cards[i]).replace('*','')===k){d.cards.splice(i,1);ex--;lost++}}
    if(lost)out.push({name:d.name,n:lost})}
  return out}
// applique l'échange dans MA collection : je perds `give`, je gagne `get` (null si l'échange est impossible)
function tradeApply(give,get,st){
  st=st||S;if(!offerOk(give)||!offerOk(get)||!hasCopy(give,st))return null;
  const e=st.coll[give.k];if(give.p)e.p--;else e.n--;
  const g=st.coll[get.k]||(st.coll[get.k]={n:0,p:0});if(get.p)g.p++;else g.n++;
  const fixed=fixDecks(st,give.k);saveS();return{fixed}}

// Session d'échange entre deux joueurs, au-dessus d'une connexion {send,on,close}.
// hooks : change(T) à chaque changement d'état, done(res) quand l'échange est fait, closed(raison) quand il est annulé ou coupé ;
// hooks.S (facultatif) renvoie la sauvegarde du joueur (par défaut la sauvegarde globale S).
// État : T.mine / T.theirs (offres), T.myLock / T.theirLock (validations), T.state = 'open' | 'done' | 'closed'.
function TradeSession(conn,peer,hooks){
  const T={conn,peer,mine:null,theirs:null,myLock:false,theirLock:false,state:'open',res:null},st=()=>hooks.S?hooks.S():S;
  const send=m=>{try{conn.send(m)}catch(e){}};
  const change=()=>{try{hooks.change&&hooks.change(T)}catch(e){console.error(e)}};
  const closed=why=>{if(T.state==='closed')return;T.state='closed';try{hooks.closed&&hooks.closed(why)}catch(e){console.error(e)}};
  const unlockBoth=()=>{T.myLock=false;T.theirLock=false};
  // quand les deux ont validé la même paire, chacun applique l'échange chez lui (une seule fois)
  const tryFinish=()=>{
    if(T.state!=='open'||!T.myLock||!T.theirLock||!T.mine||!T.theirs)return;
    const r=tradeApply(T.mine,T.theirs,st());
    if(!r){send({t:'tcancel'});closed('fail');return}
    T.state='done';T.res={give:T.mine,get:T.theirs,fixed:r.fixed};send({t:'tdone'});change();try{hooks.done&&hooks.done(T.res)}catch(e){console.error(e)}};
  T.setOffer=o=>{
    if(T.state!=='open')return false;
    if(o&&!(offerOk(o)&&hasCopy(o,st())))return false;
    T.mine=o?{k:o.k,p:o.p}:null;unlockBoth();send({t:'toff',o:T.mine});change();return true};
  T.canLock=()=>T.state==='open'&&!!T.mine&&!!T.theirs&&!T.myLock&&hasCopy(T.mine,st());
  T.lock=()=>{
    if(!T.canLock())return false;
    T.myLock=true;send({t:'tlock',give:T.mine,get:T.theirs});tryFinish();if(T.state==='open')change();return true};
  T.unlock=()=>{if(T.state!=='open'||!T.myLock)return;T.myLock=false;send({t:'tunlock'});change()};
  T.cancel=()=>{
    if(T.state==='closed')return;const was=T.state;if(was==='open')send({t:'tcancel'});T.state='closed';
    // après un échange réussi, on laisse partir les derniers messages (validation, « fait ») avant de couper
    if(was==='done')setTimeout(()=>{try{conn.close()}catch(e){}},1500);else try{conn.close()}catch(e){}
    if(was==='open'){try{hooks.closed&&hooks.closed('cancel')}catch(e){console.error(e)}}};
  conn.on('data',m=>{
    if(!m||typeof m!=='object'||T.state==='closed')return;
    if(m.t==='toff'){
      const o=m.o==null?null:cleanOffer(m.o);if(m.o!=null&&!o)return;     // offre invalide : ignorée
      if(T.state!=='open')return;T.theirs=o;unlockBoth();change();return}
    if(m.t==='tlock'){
      if(T.state!=='open')return;
      // l'autre a validé : on ne le croit que s'il s'agit exactement de la paire que je vois (sinon c'est une validation périmée)
      if(sameOffer(cleanOffer(m.give),T.theirs)&&sameOffer(cleanOffer(m.get),T.mine)){T.theirLock=true;tryFinish();if(T.state==='open')change()}
      return}
    if(m.t==='tunlock'){if(T.state==='open'){T.theirLock=false;change()}return}
    if(m.t==='tcancel'){if(T.state==='open')closed('peer');return}});
  conn.on('close',()=>{if(T.state==='open')closed('lost')});
  return T}

function fixSel(){
  const D=DUEL,V=D.V,me=V.me,s=D.sel;if(!s)return;
  if(!mine()){D.sel=null;return}
  if(s.t==='hand'||s.t==='cry'){const hd=V.p[me].hand[s.i];if(!hd||hd.k!==s.k)D.sel=null}
  else if(s.t==='atk'){if(!canAtk(V,me,s.f))D.sel=V.p[me].board[s.f]?{t:'mv',f:s.f}:null}
  else if(s.t==='mv'){if(!V.p[me].board[s.f])D.sel=null}
  else if(s.t==='tm'){if(!V.p[me].terrs.some(t=>t.id===s.id))D.sel=null}
  else if(s.t==='terr'){if(!V.shop[s.n]||!canBuy(V,me,s.n))D.sel=null}}
function computeHL(){
  const D=DUEL,V=D.V,me=V.me,s=D.sel,hl={};if(!s||!mine())return hl;
  const put=L=>L.forEach(t=>hl[t.s+':'+t.i]=1);
  if(s.t==='hand'){const cd=CARDS[V.p[me].hand[s.i].k];if(cd.t==='s'){const sp=cryTg(cd);if(sp)put(targets(V,me,sp.tg,sp.tgf))}}
  else if(s.t==='cry')put(s.t1?tg2List(V,me,s.sl):targets(V,me,s.sp.tg,s.sp.tgf));
  else if(s.t==='atk')put(atkTargets(V,me));
  return hl}
function isHL(s,i){return !!(DUEL.hl&&DUEL.hl[s+':'+i])}
function hintText(){
  const D=DUEL,V=D.V,s=D.sel;if(!s)return '';
  if(s.t==='hand'){const cd=CARDS[V.p[V.me].hand[s.i].k];
    if(cd.t==='c')return 'Clique sur un emplacement libre (ou glisse la carte)';
    return cryTg(cd)?'Choisis une cible':'Clique à nouveau sur la carte pour la jouer'}
  if(s.t==='cry')return s.t1?'Choisis ta créature à échanger (ou sa propre case pour l’échanger lui-même)':s.sp.tg2?'Choisis la créature ennemie à prendre':'Choisis la cible du Cri d’arrivée';
  const me=V.me,mc=canMoveC(V,me),mt=canMoveT(V,me);
  if(s.t==='atk')return 'Choisis qui attaquer'+(mc?', ou une case de ton plateau pour déplacer cette créature (◆ '+mvCost(V,me)+')':'');
  if(s.t==='mv')return mc?'Choisis une case de ton plateau pour déplacer cette créature (◆ '+mvCost(V,me)+')':mvWhy(V,me,0);
  if(s.t==='tm')return mt?'Choisis où déplacer ce terrain sur ton plateau (🪙 '+mvCost(V,me)+')':mvWhy(V,me,1);
  if(s.t==='terr')return s.at==null?'Clique où poser le terrain sur ton plateau':'Clique à nouveau pour confirmer';
  return ''}

    case 'chaos':if(e.i>=0){flashSlot(e.ts,e.i,GAMES.bazar.c,t);popAt(e.ts,e.i,'🌀 '+CHAOSN[e.n],'txt',t)}else popAt(e.ts,-1,'🌀 '+CHAOSN[e.n],'txt',t);t+=300;break;
    case 'ev':banner('🌀 '+e.n,'#ff4fa0');t+=400;break;
    case 'buy':{const td=TD[e.d];if(td){popAt(e.ts,-1,[gi(td.g),' '+td.n],'txt',t);for(let j=e.at;j<e.at+td.size;j++)flashSlot(e.ts,j,GAMES[td.g].c,t)}t+=200;break}
    case 'tcyc':{const td=TD[e.nd];if(td)popEl($('#shop'),'🔄 '+td.n,'txt',t);break}
    case 'steal':popAt(e.ts,-1,'📸 copie','txt',t);break;
    case 'disc':popAt(e.ts,-1,'✝ défausse','txt',t);t+=100;break;

// ---------- historique latéral ----------
// Chaque ligne montre qui a fait quoi : pastille de la carte (illustration + nom), du terrain, de la famille ou du héros concerné.
function chip(ic,name,col,title){return h('span',{class:'mi sx',title:title||name,style:'--mc:'+col},h('u',{style:'background:'+col},ic),name)}
// nombre signé pour les bonus de stats (+2, -1, +0)
function sg(n){n=n||0;return(n>0?'+':'')+n}
// coût payé pour une action (déplacement) : pastille « −1 ◆ » ou « −1 🪙 »
function costTag(e){return e.c?h('span',{class:'cst'},'−'+e.c+(e.r==='or'?' 🪙':' ◆')):null}
function mini(k){const cd=CARDS[k];if(!cd)return h('span',{class:'mi'},'?');
  return h('span',{class:'mi','data-k':k,title:cd.n+(cd.st?' — '+cd.st:'')+' · clic droit : fiche',style:'--mc:'+RCOL[cd.r]},miniAv(k),cd.n)}
function heroChip(s){const V=DUEL.V,P=V.p[s];return h('span',{class:'mi hch'+(s===V.me?' me':' op')},h('u',null,(P.nm||'?').charAt(0).toUpperCase()),s===V.me?'Toi':P.nm)}
function tgChip(s,i,k){return i<0?heroChip(s):mini(k)}
function terrChip(d){const t=TD[d];if(!t)return h('span',{class:'mut'},'terrain');const g=GAMES[t.g];return chip(gi(t.g),t.n,g.c,'Terrain '+g.n+' — '+t.n)}
function facChip(f){const F=FAC[f];return F?chip(F.ic,F.n,F.c,'Famille '+F.n):null}
// d'où vient un effet : une carte, un terrain (« T:xxx »), une famille, le Venin, la Fatigue ou un événement
function srcChip(src){
  if(!src)return null;
  if(CARDS[src])return mini(src);
  if(FAC[src])return facChip(src);
  if(typeof src==='string'&&src.slice(0,2)==='T:'&&TD[src.slice(2)])return terrChip(src.slice(2));
  if(src==='venin')return chip('☠','Venin','#8bd346');
  if(src==='fat')return chip('🥵','Fatigue','#ff7a3d');
  if(src==='ev')return chip('🌀','Événement','#ffc145');
  return chip('💥','Effet','#8aa3ae')}
// « par … » : la cause de l'événement quand elle est connue (et différente de la créature concernée)
// héros concerné quand ce n'est pas celui qui joue (pioche ou défausse de l'adversaire...)
function who(e){return e.ts!=null&&e.ts!==e.s?heroChip(e.ts):null}
function by(e){return e.cs&&e.cs!==e.k?[h('span',{class:'by'},'par'),srcChip(e.cs)]:null}
// [catégorie de couleur, éléments de la ligne] pour un événement de l'historique
function histNodes(e){
  const A=h('span',{class:'ar'},'→'),sc=e.src?srcChip(e.src):null;
  switch(e.t){
  case 'play':return['play',[h('span',{class:'vb'},'▶'),mini(e.k),e.p?h('span',{class:'pst'},'✦'):null,e.c>0?h('span',{class:'cst'},e.c+' ◆'):null,e.tg?[A,tgChip(e.tg.s,e.tg.i,e.tg.k)]:null]];
  case 'atk':return['atk',[h('span',{class:'vb'},'⚔'),mini(e.k),A,e.to==='hero'?heroChip(e.ts):mini(e.to),h('span',{class:'dm'},'−'+e.n),e.xb?h('span',{class:'mut'},'(🚧+'+e.xb+')'):null,e.r>0?h('span',{class:'rc'},'↩'+e.r):null]];
  case 'dmg':return['dmg',[sc,sc?A:null,tgChip(e.ts,e.i,e.k),h('span',{class:'dm'},e.n>=99?'détruit':'−'+e.n),sc?null:by(e)]];
  case 'heal':return['heal',[sc||(e.cs?srcChip(e.cs):null),h('span',{class:'vb'},'♥'),heroChip(e.ts),h('span',{class:'hl'},'+'+e.n)]];
  case 'hc':return['heal',[e.cs&&e.cs!==e.k?srcChip(e.cs):null,h('span',{class:'vb'},'♥'),mini(e.k),h('span',{class:'hl'},'+'+e.n)]];
  case 'pz':return['pz',[sc||(e.cs?srcChip(e.cs):null),h('span',{class:'vb'},'☠'),tgChip(e.ts,e.i,e.k),h('span',{class:'pzc'},'+'+e.n)]];
  case 'gold':return['gold',[e.from!=null?h('span',{class:'mut'},'vol :'):(sc||(e.cs?srcChip(e.cs):null)),h('span',{class:'vb'},'🪙'),heroChip(e.ts),h('span',{class:'gd'},'+'+e.n),e.from!=null&&sc?sc:null]];
  case 'fac':return['fac',[facChip(e.f),h('b',{style:'color:'+FAC[e.f].c},'×'+e.n)]];
  case 'tfx':return TD[e.d]?['tfx',[terrChip(e.d),e.k?[A,mini(e.k)]:null]]:null;
  case 'die':return['die',[h('span',{class:'vb'},e.ban?'⛔':'✝'),mini(e.k),by(e)]];
  case 'sum':return['sum',[by(e),h('span',{class:'vb'},'＋'),mini(e.k),e.rs?h('span',{class:'mut'},'(respawn)'):null]];
  case 'draw':return['card',[by(e),h('span',{class:'vb'},'🂠'),who(e),'pioche']];
  case 'burn':return['card',[h('span',{class:'vb'},'🔥'),who(e),e.k?mini(e.k):'une carte','brûlée (main pleine)',by(e)]];
  case 'add':return['card',[by(e),h('span',{class:'vb'},'🂱 +'),who(e),e.k?mini(e.k):'une carte']];
  case 'mull':return['card',[h('span',{class:'vb'},'♻'),heroChip(e.ts),e.n?'remplace '+e.n+' carte'+(e.n>1?'s':'')+' (mulligan)':'garde sa main (mulligan)']];
  case 'disc':return['card',[h('span',{class:'vb'},'✝'),who(e),mini(e.k),'défaussée (cimetière)',by(e)]];
  case 'buff':return['buff',[by(e),h('span',{class:'vb'},'⬆'),mini(e.k),h('span',{class:'bf'},sg(e.ba)+'/'+sg(e.bh))]];
  case 'tilt':return['buff',[h('span',{class:'vb'},'😡'),mini(e.k),'est tilt : son effet Tilt se déclenche']];
  case 'kwg':return['buff',[by(e),h('span',{class:'vb'},e.kw==='rempart'?'⛊':e.kw==='deso'?'💫':'✧'),mini(e.k),e.kw==='deso'?'devient Désorienté':'gagne '+(e.kw==='rempart'?'Rempart':'Égide')]];
  case 'mute':return['ctl',[by(e),h('span',{class:'vb'},'🔇'),mini(e.k),'réduit au silence']];
  case 'blk':return['ctl',[by(e),h('span',{class:'vb'},'🔒'),mini(e.k),'bloquée']];
  case 'kick':return['ctl',[by(e),h('span',{class:'vb'},'⤴'),mini(e.k),'renvoyée en main']];
  case 'egide':return['buff',[h('span',{class:'vb'},'✧'),mini(e.k),'Égide : dégâts annulés']];
  case 'steal':return['card',[by(e),h('span',{class:'vb'},'📸'),e.k?mini(e.k):'copie une carte']];
  case 'exil':return['move',[h('span',{class:'vb'},'✈️'),mini(e.k),'part à l’étranger',h('span',{class:'cst'},'−'+e.n+' 🪙')]];
  case 'move':return['move',[h('span',{class:'vb'},'↔'),mini(e.k),e.k2?['⇄',mini(e.k2)]:'déplacé(e)',costTag(e)]];
  case 'tmove':return['move',[h('span',{class:'vb'},'↔'),terrChip(e.d),'déplacé',costTag(e)]];
  case 'back':return['move',[h('span',{class:'vb'},'🏠'),mini(e.k),'est de retour']];
  case 'reshuf':return['card',[h('span',{class:'vb'},'♻'),'Cimetière remélangé : deck reformé ('+e.n+' cartes)']];
  case 'echo':return['play',[h('span',{class:'vb'},'×2'),mini(e.k)]];
  case 'story':return['sys',[by(e),h('span',{class:'vb'},'📖'),STORY[e.n]]];
  case 'chaos':return['sys',[by(e),h('span',{class:'vb'},'🌀'),CHAOSN[e.n]]];
  case 'tcyc':return TD[e.d]&&TD[e.nd]?['tfx',[h('span',{class:'vb'},'🔄'),terrChip(e.d),A,terrChip(e.nd)]]:null;
  case 'buy':return['buy',[h('span',{class:'vb'},'🏟'),terrChip(e.d),h('span',{class:'cst'},'−'+e.c+' 🪙')]];
  case 'roll':return['buy',[h('span',{class:'vb'},'🎲'),'Terrains relancés',h('span',{class:'cst'},'−'+e.c+' 🪙'),A,...(e.nd||[]).filter(d=>TD[d]).map(terrChip)]];
  case 'ev':return['sys',[chip('🌀','Événement','#ffc145'),e.n]];
  case 'fat':return['dmg',[srcChip('fat'),h('span',{class:'dm'},'−'+e.n)]];
  case 'res':return['sys',[h('span',{class:'vb'},'🏳'),'Abandon']];
  case 'deso':return['atk',[h('span',{class:'vb'},'💫'),mini(e.k),'Désorienté : cible tirée au hasard']];
  case 'ctl':return['ctl',[by(e),h('span',{class:'vb'},'⇄'),mini(e.k),'change de camp']];
  case 'swap':return['ctl',[by(e),h('span',{class:'vb'},'⇄'),mini(e.k),'et',mini(e.k2),'échangent de camp']];
  case 'tdes':return['tfx',[by(e),h('span',{class:'vb'},'💥'),e.d?terrChip(e.d):'terrain','détruit',who(e)]];
  case 'tgift':return['tfx',[by(e),h('span',{class:'vb'},'❄'),terrChip(e.d),'posé chez',heroChip(e.ts)]];
  case 'save':return['buff',[h('span',{class:'vb'},'✨'),mini(e.k),'reste à 1 PV et devient invincible']];
  case 'inv':return['buff',[h('span',{class:'vb'},'✨'),mini(e.k),'invincible : aucun dégât']];
  case 'aff':return['buff',[by(e),h('span',{class:'vb'},'↑'),mini(e.k),'affinité',gi(e.g),String(e.n)]];
  case 'tax':return['gold',[h('span',{class:'vb'},'🪙'),heroChip(e.ts),'paie '+e.n+' Or pour attaquer',mini(e.k)]];
  case 'xa':return['buff',[by(e),h('span',{class:'vb'},'⚔'),mini(e.k),'pourra attaquer une fois de plus']];
  case 'eth':return['buff',[by(e),h('span',{class:'vb'},'◆'),heroChip(e.ts),'+'+e.n+' Démoflux']];
  case 'lose':return['sys',[h('span',{class:'vb'},'☠'),heroChip(e.ts),'perd la partie (Surrender to madness)']];
  default:return null}}
function renderHist(){
  const D=DUEL,V=D.V,me=V.me,el=$('#hist');if(!el)return;
  const atBottom=el.scrollTop+el.clientHeight>=el.scrollHeight-40;
  el.innerHTML='';
  el.append(h('div',{class:'hh'},h('b',null,'Historique'),
    h('span',{class:'chip'+(D.filt==='all'?' on':''),style:'--h:#2ec4b6;--ht:#032521',onclick:()=>{D.filt='all';renderHist()}},'Tout'),
    h('span',{class:'chip'+(D.filt==='opp'?' on':''),style:'--h:#ff5d6c;--ht:#2a0008',onclick:()=>{D.filt='opp';renderHist()}},'Adversaire')));
  const list=h('div');let grp=null;
  const flush=()=>{if(grp&&grp.n.length){list.append(h('div',{class:'hact'+(grp.s===me?'':' opp')},grp.n))}grp=null};
  for(const e of D.hist){
    if(e.t==='turn'){flush();list.append(h('div',{class:'hturn'+(e.s===me?'':' opp')},'Manche '+e.n+' · '+V.p[e.s].nm));continue}
    if(D.filt==='opp'&&e.s===me)continue;
    if(!grp||grp.a!==e.a){flush();grp={a:e.a,s:e.s,n:[]}}
    const r=histNodes(e);if(r)grp.n.push(h('div',{class:'hr k-'+r[0]+(grp.n.length?'':' main')},r[1]))}
  flush();el.append(list);if(atBottom||!D._hs)el.scrollTop=el.scrollHeight;D._hs=1}

function revealPack(ov,pack,idx,total,prism){
  return new Promise(async resolve=>{

    const pk=h('div',{class:'pk idle'+(prism?' pr':'')},prism?h('div',{class:'holo'}):null,h('div',{class:'pl'},h('b',null,'✦'),prism?'PRISME':h('span',null,'ÉTAT',h('br'),'ARCANIQUE')),h('span',{class:'x5'},'×'+pack.length));
    const top=h('div',{class:'top'+(prism?' pr':'')}),beam=h('div',{class:'beam'}),glow=h('div',{class:'glow'});

    ov.append(h('div',{class:'mut sm',style:'min-height:18px'},total>1?'Booster '+(idx+1)+' sur '+total:''),stage,slots,msg,btns);
    stage.onclick=doTap;
    btns.append(h('button',{class:'btn sm',onclick:skipAll},'Tout révéler'));
    await Promise.race([waitTap(),sleep(5000)]);if(stop)return resolve(true);
    msg.textContent='';
    pk.classList.remove('idle');pk.classList.add('shake');await sleep(760);
    pk.classList.remove('shake');top.classList.add('fly');beam.classList.add('on');await sleep(380);
    pk.classList.add('open');
    for(let i=0;i<pack.length;i++){
      if(stop)return resolve(true);
      const c=pack[i],cd=CARDS[c.k],gc=c.p?'#ffffff':RCOL[c.rar],big=c.rar>=3||c.p;
      slots.children[i].classList.add('cur');

      pcard.className='pcard';pcard.replaceChildren(h('div',{class:'fl'},h('div',{class:'fi'},back,front)));
      stage.style.setProperty('--gc',gc);glow.classList.remove('on');glow.classList.toggle('pr',!!c.p);
      stage.querySelectorAll('.newr').forEach(x=>x.remove());
      void pcard.offsetWidth;pcard.classList.add('up');await sleep(560);
      pcard.classList.add('rev');glow.classList.add('on');await sleep(420);
      if(big)for(let j=0;j<22;j++){const a=Math.random()*6.283,d=90+Math.random()*150;
        const sp=h('div',{class:'spark',style:'--dx:'+Math.cos(a)*d+'px;--dy:'+Math.sin(a)*d+'px;--gc:'+(c.p?'hsl('+rint(0,360)+',100%,70%)':gc)});stage.append(sp);setTimeout(()=>sp.remove(),1300)}
      if(c.isNew)stage.append(h('div',{class:'newr'},'NOUVELLE CARTE'));
      msg.innerHTML='';msg.append(h('b',{style:'color:'+RCOL[c.rar]+';font-size:17px'},(c.p?'✦ Prismatique · ':'')+cd.n+(cd.st?' — '+cd.st:'')),h('br'),RAR[c.rar]+' · '+(cd.t==='c'?'Créature':'Sort')+' · tu en possèdes '+ownedN(c.k));
      const s=slots.children[i];s.classList.remove('cur');s.classList.add('f');s.style.setProperty('--rc',gc);s.append(miniAv(c.k));
      const last=i===pack.length-1;
      btns.replaceChildren(h('button',{class:'btn pri',style:'--h:#2ec4b6;--ht:#032521',onclick:doTap},last?(idx<total-1?'Booster suivant':'Voir le butin'):'Carte suivante'),h('button',{class:'btn sm',onclick:skipAll},'Tout révéler'));
      await waitTap();if(stop)return resolve(true);
      pcard.classList.remove('up');pcard.classList.add('out');await sleep(300)}
    resolve(false)})}

// ---------- FILTRES (collection et decks) ----------
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function cardFilter(F){const q=norm(F.q).trim();
  return k=>{const c=CARDS[k];
    if(F.t&&c.t!==F.t)return false;if(F.r&&c.r!==F.r)return false;
    if(F.fac&&(c.fac||[]).indexOf(F.fac)<0)return false;
    if(F.cost&&(F.cost>=7?c.c<7:c.c!==F.cost))return false;
    if(F.aff&&!(c.t==='c'&&!c.tok&&((c.sc&&c.sc[F.aff])||0)>=(F.afl||1)))return false;   // affinité : 1 ou plus, ou 2 seulement
    if(F.own&&ownedN(k)<=0)return false;if(F.dup&&!canRecycle(k))return false;
    if(q&&norm(c.n+' '+(c.st||'')+' '+c.tx+' '+(c.fac||[]).map(f=>FAC[f].n).join(' ')).indexOf(q)<0)return false;
    return true}}
function filterCount(F){return ['t','r','fac','cost','aff','q'].filter(k=>F[k]).length+(F.dup?1:0)}
function resetF(F,own){F.q='';F.t=0;F.r=0;F.fac='';F.cost=0;F.aff='';F.afl=0;F.dup=false;F.own=own}
function mkFilters(F,opt,onChange){
  const box=h('div',{class:'fbar'});
  const q=h('input',{placeholder:'Rechercher un nom, un titre ou un effet…',value:F.q||'',autocomplete:'off'});
  q.addEventListener('input',()=>{F.q=q.value;onChange()});
  const draw=()=>{
    const set=(k,v)=>{F[k]=F[k]===v?(typeof v==='number'?0:''):v;draw();onChange()};
    const row=(lab,kids)=>h('div',{class:'fr'},h('span',{class:'fl'},lab),kids);
    const extra=[];
    if(opt.own)extra.push(h('span',{class:'chip'+(F.own?' on':''),onclick:()=>{F.own=!F.own;draw();onChange()}},'Possédées'));
    if(opt.dup)extra.push(h('span',{class:'chip'+(F.dup?' on':''),onclick:()=>{F.dup=!F.dup;draw();onChange()}},'♻ Recyclables'));
    if(filterCount(F))extra.push(h('span',{class:'chip',onclick:()=>{resetF(F,F.own);q.value='';draw();onChange()}},'✕ Effacer les filtres'));
    box.replaceChildren(q,
      row('Type',[['c','Créatures'],['s','Sorts']].map(([v,l])=>h('span',{class:'chip'+(F.t===v?' on':''),onclick:()=>set('t',v)},l))),
      row('Rareté',[1,2,3].map(r=>h('span',{class:'chip'+(F.r===r?' on':''),style:F.r===r?'':'color:'+RCOL[r],onclick:()=>set('r',r)},RAR[r]))),
      row('Famille',FACK.map(f=>h('span',{class:'chip fchip'+(F.fac===f?' on':''),style:'--fc:'+FAC[f].c,title:FAC[f].n,onclick:()=>set('fac',f)},FAC[f].ic,h('em',null,FAC[f].n)))),
      row('Coût',[1,2,3,4,5,6,7].map(c=>h('span',{class:'chip cchip'+(F.cost===c?' on':''),onclick:()=>set('cost',c)},c===7?'7+':String(c)))),
      // affinité avec un jeu (1 ou 2, sans distinction) : un clic pour filtrer, un autre pour retirer le filtre
      row('Affinité',AFG.map(g=>{const on=F.aff===g;return h('span',{class:'chip achip'+(on?' on':''),style:'--fc:'+GAMES[g].c,
        title:'Créatures qui ont une affinité avec '+GAMES[g].n,onclick:()=>{F.aff=on?'':g;F.afl=on?0:1;draw();onChange()}},gi(g),h('em',null,GAMES[g].n))})),
      ...(extra.length?[row('',extra)]:[]))};
  draw();return box}

  const leave=()=>{TRADE_UI=null;closeModal();refreshTop();if(['friends','coll','decks'].indexOf(CUR)>=0)go(CUR)};
  const T=TradeSession(conn,peer,{
    change:()=>{if(mode==='pick'&&T.state==='open')return;mode='trade';render()},
    done:()=>{mode='trade';render()},
    closed:why=>{leave();toast(why==='cancel'?'Échange annulé.':why==='peer'?peer.name+' a annulé l’échange. Rien n’a été échangé.':why==='fail'?'Échange impossible : une des cartes n’est plus disponible. Rien n’a été échangé.':'Connexion coupée : rien n’a été échangé.')}});
  const info=o=>{const cd=CARDS[o.k];
    return h('div',{class:'tinfo'},h('b',null,cd.n+(o.p?' ✦':'')),
      h('div',{class:'sm mut'},(cd.t==='c'?'Créature':'Sort')+' · '+RAR[cd.r]+' · coût '+cd.c+(o.p?' · prismatique':'')),
      h('div',{class:'sm ttx'},txNodes(cd.tx)),
      (cd.fac&&cd.fac.length)?h('div',{class:'tfs'},cd.fac.map(f=>h('span',{class:'chip',style:'cursor:default;padding:2px 9px;font-size:12px;border-color:'+FAC[f].c+';background:'+FAC[f].c+'33'},FAC[f].ic+' '+FAC[f].n))):null)};
  const side=(cls,title,o,foot)=>h('div',{class:'tside '+cls},h('div',{class:'tl'},title),
    o?h('div',{class:'tcw'},cardEl(o.k,{big:true,p:!!o.p,tilt:1})):h('div',{class:'tempty'},cls==='me'?'Aucune carte choisie':peer.name+' n’a pas encore choisi de carte'),
    o?info(o):null,foot);
  const tradeView=()=>{
    const me=T.mine,th=T.theirs,done=T.state==='done';
    if(done){const r=T.res;
      return[h('h2',{style:'color:#7dffa5'},'✔ Échange réussi !'),h('p',{class:'mut'},'Les cartes ont été ajoutées à ta collection.'),
        h('div',{class:'tw'},side('them','Tu as reçu',r.get),h('div',{class:'tmid'},'⇄'),side('me','Tu as donné',r.give)),
        r.fixed.length?h('div',{class:'sm',style:'color:#ffd36b;margin-top:8px'},'⚠ '+r.fixed.map(x=>'« '+x.name+' » a perdu '+x.n+' exemplaire'+(x.n>1?'s':'')).join(' · ')+' de la carte donnée : pense à compléter tes decks.'):null,
        h('div',{class:'row',style:'justify-content:center;margin-top:14px'},h('button',{class:'btn pri',style:'--h:#2ec4b6;--ht:#032521',onclick:()=>{T.cancel();leave()}},'Fermer'))]}
    const status=!me&&!th?'Chacun choisit la carte qu’il donne.':!me?'Choisis la carte que tu donnes.':!th?'En attente de la carte de '+peer.name+'…':
      T.myLock?'Tu as validé. En attente de '+peer.name+'…':T.theirLock?peer.name+' a validé : vérifie les deux cartes, puis valide à ton tour.':'Vérifie bien les deux cartes, puis valide.';
    const lockPill=(on,txt)=>h('div',{class:'tok'+(on?' on':'')},on?'✔ '+txt+' validé':'… pas encore validé');
    return[h('h2',null,'⇄ Échange avec '+peer.name),h('div',{class:'tstat'},status),
      h('div',{class:'tw'},
        side('me','Tu donnes',me,h('div',{class:'tfoot'},
          h('button',{class:'btn sm',onclick:()=>{mode='pick';render()}},me?'Changer de carte':'Choisir une carte'),
          me?h('button',{class:'btn sm',onclick:()=>T.setOffer(null)},'Retirer'):null,lockPill(T.myLock,'Tu as'))),
        h('div',{class:'tmid'},'⇄'),
        side('them','Tu reçois',th,h('div',{class:'tfoot'},lockPill(T.theirLock,peer.name+' a')))),
      h('div',{class:'sm mut',style:'text-align:center;margin-top:8px'},'Les deux joueurs doivent valider la même paire de cartes. Si l’un change sa carte, les validations sont annulées.'),
      h('div',{class:'row',style:'justify-content:space-between;margin-top:14px'},
        h('button',{class:'btn danger',onclick:()=>T.cancel()},'Annuler l’échange'),
        T.myLock?h('button',{class:'btn',onclick:()=>T.unlock()},'Retirer ma validation'):
          h('button',{class:'btn green',disabled:!T.canLock(),onclick:()=>T.lock()},'Valider l’échange'))]};
  const pickView=()=>{
    const list=h('div',{class:'cgrid tgrid'});
    const draw=()=>{list.innerHTML='';let n=0;
      POOL.filter(cardFilter(TF)).sort(sortK).forEach(k=>{const e=S.coll[k]||{n:0,p:0};
        [[0,e.n],[1,e.p]].forEach(([p,cnt])=>{if(cnt<=0)return;n++;
          list.append(h('div',{class:'cc2'+(T.mine&&T.mine.k===k&&T.mine.p===p?' sel':''),onclick:()=>{if(T.setOffer({k,p})){mode='trade';render()}else toast('Cette carte n’est plus disponible.')}},
            cardEl(k,{p:!!p,tilt:1}),h('span',{class:'own'+(p?' p':'')},'×'+cnt+(p?' ✦':''))))})});
      if(!n)list.append(h('div',{class:'mut'},'Aucune carte ne correspond à ces filtres.'))};
    const f=mkFilters(TF,{own:false,dup:false},draw);draw();
    return[h('div',{class:'row',style:'justify-content:space-between;margin-bottom:8px'},h('h2',{style:'margin:0'},'Quelle carte donnes-tu à '+peer.name+' ?'),h('button',{class:'btn sm',onclick:()=>{mode='trade';render()}},'← Retour')),
      h('div',{class:'sm mut',style:'margin-bottom:6px'},'Les exemplaires prismatiques (✦) sont listés à part. Tu ne donnes qu’un exemplaire.'),f,list]};
  function render(){root.replaceChildren(...(mode==='pick'&&T.state==='open'?pickView():tradeView()))}
  render()}

// ---------- CODE ----------
function vCode(v){
  const i=h('input',{placeholder:'Entre un code',style:'flex:1',autocapitalize:'off',autocomplete:'off',spellcheck:'false'}),out=h('div',{style:'margin-top:10px'});
  const go_=()=>{const r=redeemCode(i.value);i.value='';
    out.innerHTML='';out.append(r.ok?h('div',{style:'color:#6dffa0;font-weight:800'},'✔ Code valide : +'+r.n+' 💎 ajoutés !'):h('div',{style:'color:#ffb3c0;font-weight:700'},'Code invalide.'));refreshTop()};
  i.addEventListener('keydown',e=>{if(e.key==='Enter')go_()});
  v.append(h('div',{class:'panel hl',style:'max-width:620px'},ph('code','Code'),h('p',{class:'mut sm',style:'margin:0 0 10px'},'Entre un code pour recevoir des 💎 (réservé aux tests).'),
    h('div',{class:'row'},i,h('button',{class:'btn pri',onclick:go_},'Valider')),out))}

// ---------- démarrage ----------
function askName(then){
  const i=h('input',{value:'Joueur'+rint(100,999),maxlength:16,style:'width:100%;font-size:18px;font-weight:700'});
  const ok=()=>{S.name=i.value.trim().slice(0,16)||'Joueur';saveS();closeModal();refreshTop();then&&then()};
  i.addEventListener('keydown',e=>{if(e.key==='Enter')ok()});
  modal(h('div',null,h('h2',null,'Bienvenue dans l’État Arcanique'),h('p',{class:'mut'},'Choisis ton pseudo. Tu pourras le changer dans l’onglet Amis.'),i,
    h('div',{class:'row',style:'justify-content:flex-end;margin-top:14px'},h('button',{class:'btn gold',onclick:ok},'C’est parti'))),{sticky:true});
  setTimeout(()=>{try{i.focus();i.select()}catch(e){}},50)}
function boot(){
  loadS();
  const lg=h('div',{class:'logo'});lg.innerHTML=EMBLEM;lg.append(h('b',null,'L’ÉTAT ARCANIQUE'));
  $('#top').append(lg,h('nav',{id:'nav'}),h('span',{id:'pname'}),h('div',{class:'gems',title:'Tes diamants'},h('span',{class:'gi'},'💎'),h('span',{id:'gemn'},S.gems)));
  go('play');
  const after=()=>{
    const m=location.hash.match(/#(ARCANE-[A-Z0-9]{6})/i);
    if(m){const code=m[1].toUpperCase();history.replaceState(null,'',location.pathname+location.search);
      if(code!==S.code&&!S.friends.some(f=>f.code===code))ask('Invitation reçue','Ajouter le joueur '+code+' à tes amis ?',[{t:'Plus tard'},{t:'Ajouter',c:'pri',f:()=>{S.friends.push({code,name:'Ami '+code.slice(7)});saveS();go('friends')}}])}};
  if(!S.name)askName(()=>{after();if(!S.seen.howto){S.seen.howto=1;saveS();howto()}});else after();
  netStart(()=>{const e=$('#netl');if(e)e.textContent=netLine()})}
window.addEventListener('load',boot);
</script>
